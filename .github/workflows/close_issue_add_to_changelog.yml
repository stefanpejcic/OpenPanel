name: Update Changelog on Issue Close

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: read

jobs:
  update-changelog:
    if: github.event.issue.milestone != null && github.event.issue.state == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check if issue has completed label
        id: check_completed_label
        env:
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
        run: |
          has_completed=$(echo "$ISSUE_LABELS" | jq -r '.[] | select(.name == "completed") | .name')
          if [[ "$has_completed" == "completed" ]]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "completed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if issue not completed
        if: steps.check_completed_label.outputs.completed != 'true'
        run: |
          echo "Issue is closed but not marked as completed. Skipping."
          exit 0

      - name: Check milestone status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_TITLE: ${{ github.event.issue.milestone.title }}
          MILESTONE_URL: ${{ github.event.issue.milestone.url }}
        run: |
          # event fields only reach the shell through env, an expression pasted into run let a title with $(...) or backticks run as shell
          if [[ ! "$MILESTONE_TITLE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Milestone title is not a version. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if milestone is still open
          STATUS=$(curl -s -H "Authorization: token $GH_TOKEN" "$MILESTONE_URL" | jq -r .state)
          echo "Milestone status: $STATUS"
          if [[ "$STATUS" != "open" ]]; then
            echo "Milestone is closed. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$MILESTONE_TITLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Append closed issue to changelog
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          FILE="website/docs/changelog/${VERSION}.md"

          if [[ ! -f "$FILE" ]]; then
            echo "Changelog file not found: $FILE"
            exit 1
          fi

          ENTRY="- [${ISSUE_TITLE} #${ISSUE_NUMBER}](${ISSUE_URL})"

          # Insert right under the first '### 🐛 Bug Fixes', or add that heading at the end. No getline: the template
          # ends on the heading, getline hit EOF there and printed the heading 3 times
          TMP_FILE="${FILE}.tmp"
          awk -v entry="$ENTRY" '
            { print }
            !inserted && $0 == "### 🐛 Bug Fixes" { print entry; inserted=1 }
            END {
              if (!inserted) {
                print "### 🐛 Bug Fixes"
                print entry
              }
            }
          ' "$FILE" > "$TMP_FILE"

          mv "$TMP_FILE" "$FILE"

      - name: Commit and push changelog update
        if: steps.check.outputs.skip == 'false'
        env:
          TOKEN: ${{ secrets.TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "website/docs/changelog/$VERSION.md"
          git commit -m "chore: update changelog $VERSION for issue #$ISSUE_NUMBER" || exit 0
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
