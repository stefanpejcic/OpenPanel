name: Weekly LinkedIn Post Queue

on:
  schedule:
    - cron: '0 8 * * 1'   # Monday 08:00 UTC
  workflow_dispatch:

jobs:
  build-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate this week's LinkedIn post drafts
        id: generate
        run: |
          OUTPUT=$(python3 website/scripts/generate_linkedin_queue.py)
          echo "$OUTPUT"
          {
            echo "body<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push queue + rotation state
        env:
          TOKEN: ${{ secrets.TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/scripts/linkedin_state.json website/linkedin-queue/

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate LinkedIn post queue for week of $(date +%F)"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git
          else
            echo "No changes to commit."
          fi

      - name: Open GitHub issue with this week's posts
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh label create "linkedin" --color 0A66C2 --description "Weekly LinkedIn post queue" --force
          gh issue create \
            --title "LinkedIn queue: week of $(date +%F)" \
            --label "linkedin" \
            --body "${{ steps.generate.outputs.body }}"

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -n --arg content "📅 This week's LinkedIn post drafts are ready — check the new \`linkedin\` issue on GitHub and schedule them on the OpenPanel company page." '{content: $content}')
          curl -sS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
