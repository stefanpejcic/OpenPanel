name: E2E (user panel)

# Runs the OpenPanel (user panel) Playwright suite against the shared test
# server. Called from release.yml on a beta build, and runnable on demand with
# any image tag. Deploys the image to the test box first, then runs the suite
# from the runner over the network. A failing run opens/updates a persistent
# issue on this repo.

on:
  workflow_call:
    inputs:
      image_tag:
        description: "openpanel/openpanel image tag to deploy and test"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "openpanel/openpanel image tag to deploy and test (e.g. 1.2.3-beta)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-user-panel-shared-box
  cancel-in-progress: true

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    # hard cap so a hung installer/spec can't run for hours
    timeout-minutes: 180
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: stefanpejcic/openpanel-tests
          path: tests

      - name: Setup SSH to test box
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TEST_SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "${{ secrets.TEST_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Acquire exclusive box lock
        # user-panel (this repo) and the admin suite (openadmin repo) share one
        # box; GitHub concurrency can't span repos, so serialize via a lock on it
        run: |
          ssh -i ~/.ssh/id "root@${{ secrets.TEST_SSH_HOST }}" '
            for i in $(seq 1 300); do
              if mkdir /tmp/e2e-box.lock 2>/dev/null; then
                echo "${{ github.repository }}#${{ github.run_id }}" > /tmp/e2e-box.lock/owner
                echo "lock acquired"; exit 0
              fi
              if [ -d /tmp/e2e-box.lock ] && [ $(( $(date +%s) - $(stat -c %Y /tmp/e2e-box.lock) )) -gt 9600 ]; then
                echo "breaking stale lock held by $(cat /tmp/e2e-box.lock/owner 2>/dev/null)"; rm -rf /tmp/e2e-box.lock
              fi
              echo "box busy (held by $(cat /tmp/e2e-box.lock/owner 2>/dev/null)), waiting..."; sleep 15
            done
            echo "could not acquire box lock in time"; exit 1
          '

      - name: Deploy ${{ inputs.image_tag }} to the test box
        run: |
          # mirrors `opencli update` panel step: pull image, pin VERSION, recreate the panel service.
          # per-user panel containers may need recreating too -- if /root/after-test-deploy.sh exists on
          # the box it's run with the tag, so box-specific recreate logic lives there, not hardcoded here.
          ssh -i ~/.ssh/id "root@${{ secrets.TEST_SSH_HOST }}" '
            set -e
            TAG="'"${{ inputs.image_tag }}"'"
            podman pull "openpanel/openpanel:$TAG"
            [ -f /root/.env ] && sed -i "s/^VERSION=.*/VERSION=\"$TAG\"/" /root/.env
            cd /root && (podman-compose up -d --force-recreate openpanel || true)
            [ -x /root/after-test-deploy.sh ] && /root/after-test-deploy.sh "$TAG" || true
            echo "deployed $TAG"
          '

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: tests
        run: |
          # mirrors INSTALL.sh: the tests repo ships no package.json, deps are installed fresh
          npm init -y >/dev/null 2>&1 || true
          npm install --yes @playwright/test dotenv basic-ftp otplib
          npx --yes playwright install --with-deps chromium

      - name: Write .env
        working-directory: tests
        run: |
          cat > openpanel/.env <<EOF
          BASE_URL=${{ secrets.PANEL_BASE_URL }}
          PANEL_USERNAME=${{ secrets.PANEL_USERNAME }}
          PANEL_PASSWORD=${{ secrets.PANEL_PASSWORD }}
          EOF

      - name: Run user panel suite
        working-directory: tests
        env:
          # whole-suite wall clock (ms): normal run is ~70m, so abort at 120m.
          # Playwright exits cleanly and still writes the json/html reports, so
          # a stuck spec can't silently burn the job's 180m cap with no output.
          PW_GLOBAL_TIMEOUT: "7200000"
        run: ./openpanel/run-tests.sh || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-user-panel
          path: |
            tests/logs/html-report-*
            tests/logs/*.json
            tests/logs/*.log
          if-no-files-found: ignore

      - name: Release box lock
        if: always()
        run: |
          ssh -i ~/.ssh/id "root@${{ secrets.TEST_SSH_HOST }}" 'rm -rf /tmp/e2e-box.lock; echo "lock released"' || true

      - name: Open/update issue on failure
        if: always() && env.TESTS_FAILED == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'E2E: user panel suite failing';
            const body = [
              `The user panel E2E suite failed for image tag \`${{ inputs.image_tag }}\`.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            try {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'e2e-failure', per_page: 100,
              });
              const hit = existing.data.find(i => i.title === title);
              if (hit) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['e2e-failure'] });
              }
            } catch (e) {
              core.warning(`could not file an issue (are issues enabled on this repo?): ${e.message}`);
            }

      - name: Fail the job if tests failed
        if: always() && env.TESTS_FAILED == '1'
        run: exit 1
