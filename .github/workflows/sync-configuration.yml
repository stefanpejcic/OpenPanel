name: Sync all repos to main
on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "stefanpejcic"
          git config --global user.email "stefan@pejcic.rs"

      - name: Ensure submodules exist
        shell: bash
        run: |
          declare -A repos=(
            ["tests"]="https://github.com/stefanpejcic/openpanel-tests"
            ["translations"]="https://github.com/stefanpejcic/openpanel-translations"
            ["configuration"]="https://github.com/stefanpejcic/openpanel-configuration"
            ["openadmin"]="https://github.com/stefanpejcic/openadmin"
            ["integrations/cpanel-import"]="https://github.com/stefanpejcic/cPanel-to-OpenPanel"
            ["integrations/cyberpanel-import"]="https://github.com/stefanpejcic/CyberPanel-to-OpenPanel"
            ["integrations/whmcs"]="https://github.com/stefanpejcic/openpanel-whmcs-module"
            ["integrations/virtualizor"]="https://github.com/stefanpejcic/openpanel-virtualizor"
            ["integrations/paymenter.org"]="https://github.com/stefanpejcic/openpanel-paymenter.org"
            ["integrations/fossbilling"]="https://github.com/stefanpejcic/FOSSBilling-OpenPanel"
          )

          # Paths that track the podman branch instead of main
          podman_paths=("integrations/cpanel-import" "integrations/cyberpanel-import")

          is_podman_path() {
            local target="$1"
            for p in "${podman_paths[@]}"; do
              [ "$p" == "$target" ] && return 0
            done
            return 1
          }

          for path in "${!repos[@]}"; do
            url="${repos[$path]}"
            exists=false
            if [ -f .gitmodules ]; then
              if git config --file .gitmodules --get-regexp "^submodule\..*\.path$" 2>/dev/null \
                  | awk '{print $2}' | grep -qx "$path"; then
                exists=true
              fi
            fi

            if [ "$exists" = true ]; then
              echo "Submodule already exists: $path"
            else
              echo "Adding submodule: $path -> $url"
              git rm -r --cached "$path" 2>/dev/null || true
              rm -rf "$path"
              if is_podman_path "$path"; then
                git submodule add -f -b podman "$url" "$path"
              else
                git submodule add -f "$url" "$path"
              fi
            fi
          done

          # opencli special-cased: track the podman branch
          opencli_exists=false
          if [ -f .gitmodules ]; then
            if git config --file .gitmodules --get-regexp "^submodule\..*\.path$" 2>/dev/null \
                | awk '{print $2}' | grep -qx "opencli"; then
              opencli_exists=true
            fi
          fi

          if [ "$opencli_exists" = true ]; then
            echo "Submodule already exists: opencli"
          else
            echo "Adding submodule: opencli -> podman branch"
            git rm -r --cached opencli 2>/dev/null || true
            rm -rf opencli
            git submodule add -f -b podman https://github.com/stefanpejcic/opencli opencli
          fi

      - name: Ensure correct tracking branches
        shell: bash
        run: |
          git config -f .gitmodules submodule.configuration.branch main
          git config -f .gitmodules submodule.tests.branch main
          git config -f .gitmodules submodule.translations.branch main
          git config -f .gitmodules submodule.openadmin.branch main
          git config -f .gitmodules submodule.opencli.branch podman
          git config -f .gitmodules submodule.integrations/cpanel-import.branch podman
          git config -f .gitmodules submodule.integrations/cyberpanel-import.branch podman
          git config -f .gitmodules submodule.integrations/whmcs.branch main
          git config -f .gitmodules submodule.integrations/virtualizor.branch main
          git config -f .gitmodules submodule.integrations/paymenter.org.branch main
          git config -f .gitmodules submodule.integrations/fossbilling.branch main

      - name: Update submodules to latest upstream commits
        shell: bash
        run: |
          git submodule sync --recursive
      
          git submodule foreach --recursive '
            git fetch --all --prune
          '
      
          rm -rf integrations/cpanel-import integrations/cyberpanel-import
      
          git submodule update --init --recursive --remote --merge


      - name: Sync OpenCLI binary needed in Dockerfile
        shell: bash
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/stefanpejcic/opencli/refs/heads/podman/opencli \
            -o openpanel/opencli

          chmod +x openpanel/opencli

      - name: Commit and push if changed
        shell: bash
        run: |
          git add .gitmodules tests translations configuration opencli openadmin integrations openpanel/opencli
          if ! git diff --cached --quiet; then
            git commit -m "chore: update submodule references to latest upstream"
            git push origin main
          else
            echo "No changes to commit."
          fi
