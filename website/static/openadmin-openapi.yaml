        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      summary: Starts an import of a cPanel or CyberPanel backup into a new OpenPanel account, cloning/running
        the import script for the given backup path and target hosting plan in the background.
