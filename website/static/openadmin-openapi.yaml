      - Import & Transfers
      parameters:
      - name: panel_type
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  example: /root/backup-user.tar.gz
