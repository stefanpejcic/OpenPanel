  /api/import/transfers:
    get:
      summary: Lists every OpenPanel-to-OpenPanel transfer log file (*.log) directly under the transfer
        log directory, as a flat array of file paths. Delegates to the same logic as the HTML admin /json/transfers
        route.
      description: '**Access:** Administrator or user role (the reseller role is blocked).'
      operationId: get_import_transfers
      tags:
      - Import & Transfers
      responses:
        '200':
          description: Success.
