      - bearerAuth: []
    post:
      summary: Starts a live OpenPanel-to-OpenPanel account transfer in the background by running `opencli
        user-transfer` with the given target account, host, and SSH credentials. If the target server
        is an IP (not a domain), it also configures iptables for the transfer.
