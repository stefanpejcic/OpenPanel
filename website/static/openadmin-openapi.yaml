            schema:
              type: object
              properties:
                openpanel_username:
                  type: string
                  example: newuser
                server:
                  type: string
                  example: example.com
                username:
                  type: string
                  example: root
                password:
                  type: string
                  example: secret
                port:
                  type: integer
                  example: 2222
                live_transfer:
                  type: boolean
                  example: true
              example:
                openpanel_username: newuser
                server: example.com
                username: root
                password: secret
                port: 2222
                live_transfer: true
