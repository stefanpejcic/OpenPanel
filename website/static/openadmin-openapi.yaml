openapi: 3.0.3
info:
  title: OpenAdmin API
  version: 1.0.0
  description: |-
    REST API for OpenAdmin, the administrator-level control panel for OpenPanel server management. Every feature available in OpenAdmin's web UI can also be accessed programmatically.

    All endpoints require a Bearer token obtained from `POST /api/` (username/password login), except the login call itself and the `GET /api/` health check. Tokens expire after 15 minutes. Beyond authentication, most endpoints also require the administrator role -- see each operation's **Access** note for its exact requirement (some allow a reseller who owns the target account, and a handful of the most dangerous server-control actions require the Super Admin role specifically).

    The whole API is also gated behind [PANEL] api=on and a configured license key -- when either is off, every /api/* route (including this one) responds as if it doesn't exist.

    Success responses are JSON objects (`200`) unless noted otherwise. Error responses always include an `error` field and use standard HTTP status codes (400, 401, 403, 404, 409, 500).
  contact:
    name: OpenPanel
    url: https://openpanel.com
  license:
    name: OpenPanel EULA
    url: https://openpanel.com/LICENSE
servers:
- url: https://panel.example.com:2087
  description: Your OpenAdmin installation (default port 2087)
