info:
  title: OpenPanel API
  version: 2.0.2
  description: |-
    REST API for OpenPanel, a self-hosted web hosting control panel. Every feature available in the panel's web UI can also be accessed programmatically.

    All endpoints require a Bearer token obtained from `POST /api/login`. Beyond authentication, each endpoint also requires its documented feature to be enabled on the account's hosting plan.

    Success responses are JSON objects (`200`) unless noted otherwise (a handful of endpoints stream a file download instead). Error responses always include an `error` field and use standard HTTP status codes (400, 401, 403, 404, 409, 500, 503, 504).
  contact:
    name: OpenPanel
    url: https://openpanel.com
  license:
    name: OpenPanel EULA
    url: https://openpanel.com/LICENSE
