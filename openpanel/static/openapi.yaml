components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Obtain a token via `POST /api/login`. Tokens expire after 24 hours.
  responses:
    Error:
      description: An error occurred. See the `error` field for details.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: You do not own this domain
              hint:
                type: string
            required:
            - error
security:
- bearerAuth: []
