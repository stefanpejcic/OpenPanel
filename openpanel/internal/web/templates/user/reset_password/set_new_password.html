{{define "content"}}
<!-- START templates/user/reset_password/set_new_password.html -->

<div class="op-auth-card">
    <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="leading-tight tracking-tight md:text-2xl op-title">
            {{.T.Get "Reset Your Password"}}
        </h1>

        <form
            id="resetPasswordForm"
            method="POST"
            class="space-y-4 md:space-y-6"
            action=""
        >
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

            <div>
                <label for="password" class="op-label op-label-row">{{.T.Get "New Password"}}<span class="is-danger">*</span></label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="••••••••"
                    class="op-input"
                    required
                >

                <div class="op-progress op-strength">
                    <div id="passwordStrengthBar" class="op-strength-bar"></div>
                </div>
                <p class="mt-1 text-sm font-semibold">
                    <span id="passwordStrengthMessage" class="text-xs"></span>
                </p>
            </div>

            <div>
                <label for="confirm_password" class="op-label op-label-row">{{.T.Get "Confirm Password"}}<span class="is-danger">*</span></label>
                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    placeholder="••••••••"
                    class="op-input"
                    required
                >
            </div>

            <div id="passwordError" class="text-sm is-danger" style="display:none;">
                {{.T.Get "Passwords do not match."}}
            </div>

            <button
                type="submit"
                class="w-full me-2 mb-2 op-btn op-btn-primary"
            >
                {{.T.Get "Change Password"}}
            </button>
        </form>

        <!-- START errors -->
        {{with .FirstFlash}}
        <div class="mt-6 flex items-center space-x-2.5 p-4"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" aria-hidden="true" class="remixicon size-5 shrink-0 is-success">
        <path d="M12 22C6.477 22 2 17.523 2 12C2 6.477 6.477 2 12 2C17.523 2 22 6.477 22 12C22 17.523 17.523 22 12 22ZM10 16.586L16.293 10.293L14.879 8.879L10 13.757L9.121 12.879L7.707 14.293L10 16.586Z"></path>
        </svg>
        <p class="text-sm is-success">{{$.T.Get .Text}}</p></div>
        {{end}}

        {{if .ErrorMessage}}
        <div class="mt-6 flex items-center space-x-2.5 p-4"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" aria-hidden="true" class="remixicon size-5 shrink-0 is-danger"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM11 15V17H13V15H11ZM11 7V13H13V7H11Z"></path></svg><p class="text-sm is-danger">{{.ErrorMessage}}</p></div>
        {{end}}
        <!-- END errors -->

    </div>
</div>

<script src="{{static "js/password-strength.js"}}"></script>
<script>
var PASSWORD_STRENGTH_THRESHOLD = {{.PasswordStrength}};
var PASSWORD_STRENGTH_LABELS = {
    weak: {{toJSON (.T.Get "Weak password")}},
    medium: {{toJSON (.T.Get "Medium strength password")}},
    strong: {{toJSON (.T.Get "Strong password")}},
    tooWeak: {{toJSON (.T.Get "Password does not meet the required strength.")}}
};

document.getElementById('password').addEventListener('input', function() {
    var val = this.value;
    var bar = document.getElementById('passwordStrengthBar');
    var message = document.getElementById('passwordStrengthMessage');
    var score = passwordStrengthScore(val);

    bar.className = 'h-full op-strength-bar';
    message.className = 'text-xs';

    if (!val) {
        bar.style.width = '0%';
        message.textContent = '';
    } else if (score <= 33) {
        bar.classList.add('is-danger');
        bar.style.width = '33%';
        message.classList.add('is-danger');
        message.textContent = PASSWORD_STRENGTH_LABELS.weak;
    } else if (score <= 67) {
        bar.classList.add('is-warning');
        bar.style.width = '66%';
        message.classList.add('is-warning');
        message.textContent = PASSWORD_STRENGTH_LABELS.medium;
    } else {
        bar.classList.add('is-success');
        bar.style.width = '100%';
        message.classList.add('is-success');
        message.textContent = PASSWORD_STRENGTH_LABELS.strong;
    }

    this.setCustomValidity(val && score < PASSWORD_STRENGTH_THRESHOLD ? PASSWORD_STRENGTH_LABELS.tooWeak : '');
});

document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirm_password').value;
    var errorDiv = document.getElementById('passwordError');

    if (password !== confirmPassword) {
        e.preventDefault();
        errorDiv.style.display = 'block';
    } else {
        errorDiv.style.display = 'none';
    }
});
</script>

<!-- END templates/user/reset_password/set_new_password.html -->
{{end}}
