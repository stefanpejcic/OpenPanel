{{define "content"}}
<!-- START templates/user/reset_password/set_new_password.html -->

<div class="w-full rounded-md border border-gray-200 bg-white p-6 shadow-xs dark:border-gray-900 dark:bg-raised">
    <div>
        <h1 class="text-center text-lg font-semibold text-gray-900 dark:text-gray-50">
            {{.T.Get "Reset your password"}}
        </h1>

        <form
            id="resetPasswordForm"
            method="POST"
            class="mt-6 space-y-4"
            action=""
        >
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

            <div>
                <label for="password" class="mb-2 block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "New password"}}<span class="text-red-600 dark:text-red-500" aria-hidden="true">*</span></label>
                <div class="relative">
                <div class="relative">
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="••••••••"
                    class="pr-10 block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500"
                    required
                >
                <button type="button" data-toggle-password="password" aria-label="{{.T.Get "Show password"}}" aria-pressed="false" class="absolute inset-y-0 right-1 my-auto inline-flex size-8 items-center justify-center rounded-md text-gray-500 transition hover:bg-gray-100 hover:text-gray-900 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 dark:text-gray-400 dark:hover:bg-gray-800/80 dark:hover:text-gray-50"><i class="ri-eye-line text-base" aria-hidden="true"></i></button>
                </div>

                <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-gray-200 dark:bg-gray-800">
                    <div id="passwordStrengthBar" class="h-full rounded-full transition-all duration-300"></div>
                </div>
                <p class="mt-1 text-xs font-medium">
                    <span id="passwordStrengthMessage" class="text-xs"></span>
                </p>
            </div>

            <div>
                <label for="confirm_password" class="mb-2 block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "Confirm password"}}<span class="text-red-600 dark:text-red-500" aria-hidden="true">*</span></label>
                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    placeholder="••••••••"
                    class="pr-10 block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500"
                    required
                >
                <button type="button" data-toggle-password="confirm_password" aria-label="{{.T.Get "Show password"}}" aria-pressed="false" class="absolute inset-y-0 right-1 my-auto inline-flex size-8 items-center justify-center rounded-md text-gray-500 transition hover:bg-gray-100 hover:text-gray-900 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 dark:text-gray-400 dark:hover:bg-gray-800/80 dark:hover:text-gray-50"><i class="ri-eye-line text-base" aria-hidden="true"></i></button>
                </div>
            </div>

            <div id="passwordError" class="text-xs text-red-600 dark:text-red-500" style="display:none;">
                {{.T.Get "Passwords do not match."}}
            </div>

            <button
                type="submit"
                class="w-full relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-transparent bg-blue-500 text-white hover:bg-blue-600 disabled:bg-blue-300 dark:disabled:bg-blue-800 dark:disabled:text-blue-400"
            >
                {{.T.Get "Change password"}}
            </button>
        </form>

        <!-- START errors -->
        {{with .FirstFlash}}
        <div class="mt-5 flex gap-3 rounded-md p-4 text-sm bg-emerald-50 text-emerald-900 dark:bg-emerald-950/70 dark:text-emerald-500" role="status"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" aria-hidden="true" class="remixicon size-5 shrink-0 text-emerald-500 dark:text-emerald-500">
        <path d="M12 22C6.477 22 2 17.523 2 12C2 6.477 6.477 2 12 2C17.523 2 22 6.477 22 12C22 17.523 17.523 22 12 22ZM10 16.586L16.293 10.293L14.879 8.879L10 13.757L9.121 12.879L7.707 14.293L10 16.586Z"></path>
        </svg>
        <p>{{$.T.Get .Text}}</p></div>
        {{end}}

        {{if .ErrorMessage}}
        <div class="mt-5 flex gap-3 rounded-md p-4 text-sm bg-red-50 text-red-900 dark:bg-red-950/70 dark:text-red-500" role="alert"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" aria-hidden="true" class="remixicon size-5 shrink-0 text-red-500 dark:text-red-500"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM11 15V17H13V15H11ZM11 7V13H13V7H11Z"></path></svg><p>{{.ErrorMessage}}</p></div>
        {{end}}
        <!-- END errors -->

    </div>
</div>

<script src="{{static "js/password-strength.js"}}"></script>
<script>
var PASSWORD_STRENGTH_THRESHOLD = {{.PasswordStrength}};
var PASSWORD_STRENGTH_LABELS = {
    weak: {{toJSON (.T.Get "Weak password")}},
    medium: {{toJSON (.T.Get "Medium strength password")}},
    strong: {{toJSON (.T.Get "Strong password")}},
    tooWeak: {{toJSON (.T.Get "Password does not meet the required strength.")}}
};

document.getElementById('password').addEventListener('input', function() {
    var val = this.value;
    var bar = document.getElementById('passwordStrengthBar');
    var message = document.getElementById('passwordStrengthMessage');
    var score = passwordStrengthScore(val);

    bar.className = 'h-full rounded-full transition-all duration-300';
    message.className = 'text-xs';

    if (!val) {
        bar.style.width = '0%';
        message.textContent = '';
    } else if (score <= 33) {
        bar.classList.add('bg-red-500');
        bar.style.width = '33%';
        message.classList.add('text-red-600', 'dark:text-red-400');
        message.textContent = PASSWORD_STRENGTH_LABELS.weak;
    } else if (score <= 67) {
        bar.classList.add('bg-yellow-500');
        bar.style.width = '66%';
        message.classList.add('text-yellow-700', 'dark:text-yellow-500');
        message.textContent = PASSWORD_STRENGTH_LABELS.medium;
    } else {
        bar.classList.add('bg-emerald-500');
        bar.style.width = '100%';
        message.classList.add('text-emerald-600', 'dark:text-emerald-400');
        message.textContent = PASSWORD_STRENGTH_LABELS.strong;
    }

    this.setCustomValidity(val && score < PASSWORD_STRENGTH_THRESHOLD ? PASSWORD_STRENGTH_LABELS.tooWeak : '');
});

document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirm_password').value;
    var errorDiv = document.getElementById('passwordError');

    if (password !== confirmPassword) {
        e.preventDefault();
        errorDiv.style.display = 'block';
    } else {
        errorDiv.style.display = 'none';
    }
});
</script>

<!-- END templates/user/reset_password/set_new_password.html -->
{{end}}
