{{define "content"}}
<!-- START templates/user/reset_password/link_is_sent.html -->
<div class="w-full rounded-md border border-gray-200 bg-white p-6 shadow-xs dark:border-gray-900 dark:bg-raised">

    <div class="space-y-4 text-center">
        <div class="mx-auto flex size-12 items-center justify-center rounded-full bg-emerald-50 dark:bg-emerald-950/70">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" class="remixicon size-6 shrink-0 text-emerald-600 dark:text-emerald-500">
                <path d="M12 22C6.477 22 2 17.523 2 12C2 6.477 6.477 2 12 2C17.523 2 22 6.477 22 12C22 17.523 17.523 22 12 22ZM10 16.586L16.293 10.293L14.879 8.879L10 13.757L9.121 12.879L7.707 14.293L10 16.586Z"></path>
            </svg>
        </div>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Password reset link sent"}}</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400">{{.T.Get "Please check your email and click the link within the next 15 minutes to reset your password."}}</p>
        <a href="/login" class="w-full relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600">{{.T.Get "Back to login"}}</a>
    </div>
</div>
<!-- END templates/user/reset_password/link_is_sent.html -->
{{end}}
