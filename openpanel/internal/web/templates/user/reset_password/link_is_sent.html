{{define "content"}}
<!-- START templates/user/reset_password/link_is_sent.html -->
<div class="op-auth-card">

    <div class="text-center justify-center p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="leading-tight tracking-tight md:text-2xl op-title">{{.T.Get "Password Reset Link Sent"}}</h1>
        <div class="flex text-center justify-center">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" class="op-auth-ok is-success">
                <path d="M12 22C6.477 22 2 17.523 2 12C2 6.477 6.477 2 12 2C17.523 2 22 6.477 22 12C22 17.523 17.523 22 12 22ZM10 16.586L16.293 10.293L14.879 8.879L10 13.757L9.121 12.879L7.707 14.293L10 16.586Z"></path>
            </svg>
        </div>
        <p class="op-strong">{{.T.Get "Please check your email and click the link within the next 15 minutes to reset your password."}}</p>
        <a href="/login" class="op-btn op-btn-secondary">{{.T.Get "Back to Login"}}</a>
    </div>
</div>
<!-- END templates/user/reset_password/link_is_sent.html -->
{{end}}
