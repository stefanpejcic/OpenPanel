{{define "content"}}
<!-- START templates/user/reset_password/request_email.html -->

<div class="op-auth-card">
    <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="leading-tight tracking-tight md:text-2xl op-title">
            {{.T.Get "Forgot Your Password?"}}
        </h1>
        <p class="op-strong">
            {{.T.Get "Enter your email address and we'll send you a link to reset your password."}}
        </p>
        <form method="POST" class="space-y-4 md:space-y-6" action="/reset_password">

            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

            <div>
                <label for="email" class="flex mb-2 text-sm font-medium justify-between op-strong"><span>{{.T.Get "Email"}}<span class="is-danger">*</span></span> <a href="/login" tabindex="-1">{{.T.Get "Back to Login"}}</a></label>
                <input type="text" name="email" id="email" class="op-input" required placeholder="{{.T.Get "Enter your email address"}}" {{if contains .ErrorMessage "@"}}autofocus value="{{.Email}}"{{else if .Email}}value="{{.Email}}"{{else}}autofocus{{end}}>
            </div>

            <button type="submit" class="w-full me-2 mb-2 op-btn op-btn-primary">{{.T.Get "Send Reset Link"}}</button>
        </form>

        <!-- START errors -->
        {{with .FirstFlash}}
        <div class="mt-6 flex items-center space-x-2.5 p-4"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" aria-hidden="true" class="remixicon size-5 shrink-0 is-success">
        <path d="M12 22C6.477 22 2 17.523 2 12C2 6.477 6.477 2 12 2C17.523 2 22 6.477 22 12C22 17.523 17.523 22 12 22ZM10 16.586L16.293 10.293L14.879 8.879L10 13.757L9.121 12.879L7.707 14.293L10 16.586Z"></path>
        </svg>
        <p class="text-sm is-success">{{$.T.Get .Text}}</p></div>
        {{end}}

        {{if .ErrorMessage}}
        <div class="mt-6 flex items-center space-x-2.5 p-4"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" aria-hidden="true" class="remixicon size-5 shrink-0 is-danger"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM11 15V17H13V15H11ZM11 7V13H13V7H11Z"></path></svg><p class="text-sm is-danger">{{.ErrorMessage}}</p></div>
        {{end}}
        <!-- END errors -->

    </div>
</div>

<!-- END templates/user/reset_password/request_email.html -->
{{end}}
