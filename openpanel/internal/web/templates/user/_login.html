<svg version="1.0" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 213.000000 215.000000" preserveAspectRatio="xMidYMid meet"><g transform="translate(0.000000,215.000000) scale(0.100000,-0.100000)" fill="currentColor" stroke="none"><path d="M990 2071 c-39 -13 -141 -66 -248 -129 -53 -32 -176 -103 -272 -158 -206 -117 -276 -177 -306 -264 -17 -50 -19 -88 -19 -460 0 -476 0 -474 94 -568 55 -56 124 -98 604 -369 169 -95 256 -104 384 -37 104 54 532 303 608 353 76 50 126 113 147 184 8 30 12 160 12 447 0 395 -1 406 -22 461 -34 85 -98 138 -317 264 -104 59 -237 136 -295 170 -153 90 -194 107 -275 111 -38 2 -81 0 -95 -5z m205 -561 c66 -38 166 -95 223 -127 l102 -58 0 -262 c0 -262 0 -263 -22 -276 -13 -8 -52 -31 -88 -51 -36 -21 -126 -72 -200 -115 l-135 -78 -3 261 -3 261 -166 95 c-91 52 -190 109 -219 125 -30 17 -52 34 -51 39 3 9 424 256 437 255 3 0 59 -31 125 -69z"></path></g></svg><span>OpenPanel</span>
</a>
</p>
{{end}}


<div class="mt-6">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

  <div class="col-span-full">

    <!-- Custom flag dropdown -->
    <div class="relative" id="locale-dropdown">
      <button
        type="button"
        id="locale-btn"
        class="flex items-center gap-2 w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded px-2.5 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer"
        aria-haspopup="listbox"
        aria-expanded="false"
      >
        <img id="locale-flag" src="" alt="" class="w-5 h-4 object-cover rounded-sm hidden" />
        <span id="locale-label" class="flex-1 text-left text-gray-400 dark:text-gray-400">{{.T.Get "Change Language"}}</span>
        <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" id="locale-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <ul
        id="locale-list"
        role="listbox"
        class="hidden absolute z-50 mt-1 w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded shadow-lg max-h-60 overflow-y-auto"
      >
        {{range .Locales}}
        <li
          role="option"
          data-value="{{.Code}}"
          class="flex items-center gap-2 px-2.5 py-1.5 text-sm text-gray-900 dark:text-white hover:bg-blue-50 dark:hover:bg-gray-600 cursor-pointer"
        >
        <img
          src="/static/flags/{{.FlagCode}}.png"
          alt="{{.Code}}"
          class="w-5 h-4 object-cover rounded-sm"
          onerror="this.style.display='none'"
        />
          <span>{{.Code}}</span>
        </li>
        {{end}}
      </ul>
    </div>

  </div>
</div>

<script>
(function () {
  var btn      = document.getElementById('locale-btn');
  var list     = document.getElementById('locale-list');
  var label    = document.getElementById('locale-label');
  var flag     = document.getElementById('locale-flag');
  var chevron  = document.getElementById('locale-chevron');

  btn.addEventListener('click', function () {
    var open = list.classList.toggle('hidden');
    btn.setAttribute('aria-expanded', String(!open)); // open means NOT hidden
    chevron.style.transform = list.classList.contains('hidden') ? '' : 'rotate(180deg)';
  });

  document.addEventListener('click', function (e) {
    if (!document.getElementById('locale-dropdown').contains(e.target)) {
      list.classList.add('hidden');
      btn.setAttribute('aria-expanded', 'false');
      chevron.style.transform = '';
    }
  });

  list.querySelectorAll('[role="option"]').forEach(function (item) {
    item.addEventListener('click', function () {
      var selectedLocale = item.getAttribute('data-value');
      var selectedImg    = item.querySelector('img');

      label.textContent = selectedLocale;
      label.classList.remove('text-gray-400', 'dark:text-gray-400');

      if (selectedImg && selectedImg.style.display !== 'none') {
        flag.src = selectedImg.src;
        flag.alt = selectedImg.alt;
        flag.classList.remove('hidden');
      } else {
        flag.classList.add('hidden');
      }

      list.classList.add('hidden');
      btn.setAttribute('aria-expanded', 'false');
      chevron.style.transform = '';

      fetch('/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRF-TOKEN': "{{.CSRFToken}}"
        },
        body: 'locale=' + encodeURIComponent(selectedLocale)
      }).then(function (response) {
        if (response.redirected) {
          window.location.href = response.url;
        } else {
          window.location.reload();
        }
      });
    });
  });
})();
</script>



  </div>
</section>

  </body>

  <!-- Custom code in footer: deferred until the custom_code admin feature is ported -->

    <!-- The Jinja original guards this with {% if url_for(...) %}, which is
         always truthy (url_for() always returns a URL string regardless of
         whether the file exists) - so the tag is unconditional there too,
         not gated on whether custom.js actually has content. -->
    <script src="{{static "js/custom.js"}}"></script>

  <!-- END templates/user/_login.html -->
</html>
{{end}}
