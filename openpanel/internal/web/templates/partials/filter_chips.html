{{define "filter_chips_css"}}
<style>
/* rounded filter chips with a count, used by the activity log and the dns zone type filter */
.activity-chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.7rem; border-radius: 9999px; border: 1px solid #e5e7eb; font-size: 0.8125rem; color: #374151; background: #fff; text-decoration: none; transition: background-color .15s, border-color .15s; }
.activity-chip:hover { background: #f9fafb; border-color: #d1d5db; }
.activity-chip.is-active { background: #111827; border-color: #111827; color: #fff; }
.activity-chip-count { font-variant-numeric: tabular-nums; color: #6b7280; font-size: 0.75rem; }
.activity-chip.is-active .activity-chip-count { color: #d1d5db; }
.activity-chip-dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: currentColor; }
.dark .activity-chip { border-color: #1f2937; color: #d1d5db; background: #030712; }
.dark .activity-chip:hover { background: #111827; border-color: #374151; }
.dark .activity-chip.is-active { background: #f9fafb; border-color: #f9fafb; color: #111827; }
.dark .activity-chip-count { color: #9ca3af; }
.dark .activity-chip.is-active .activity-chip-count { color: #4b5563; }
</style>
{{end}}
