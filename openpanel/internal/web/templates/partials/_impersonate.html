{{define "impersonate"}}{{if .Impersonating}}
<div class="bg-black text-white text-sm border-b border-gray-200 dark:border-gray-800 flex gap-4 w-full justify-center space-x-4 items-center px-4" id="impersonate-banner">
    <p class="text-sm text-gray-100 dark:text-gray-500">{{.T.Get "You are currently impersonating user"}} '{{.CurrentUsername}}'</p>
    <a id="admin-return-link" href="#" class="relative inline-flex items-center justify-center px-1 text-center text-sm font-medium shadow-sm transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-offset-2 outline-0 focus-visible:outline-2 outline-blue-500 dark:outline-blue-500 dark:text-gray-50 dark:bg-gray-950 dark:hover:bg-gray-900/60 disabled:text-gray-400 disabled:dark:text-gray-600 gap-x-1.5 whitespace-nowrap bg-black text-white hover:bg-gray-800 sm:mt-0">{{.T.Get "Back to"}} <svg version="1.0" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 213.000000 215.000000" preserveAspectRatio="xMidYMid meet"><g transform="translate(0.000000,215.000000) scale(0.100000,-0.100000)" fill="currentColor" stroke="none"><path d="M990 2071 c-39 -13 -141 -66 -248 -129 -53 -32 -176 -103 -272 -158 -206 -117 -276 -177 -306 -264 -17 -50 -19 -88 -19 -460 0 -476 0 -474 94 -568 55 -56 124 -98 604 -369 169 -95 256 -104 384 -37 104 54 532 303 608 353 76 50 126 113 147 184 8 30 12 160 12 447 0 395 -1 406 -22 461 -34 85 -98 138 -317 264 -104 59 -237 136 -295 170 -153 90 -194 107 -275 111 -38 2 -81 0 -95 -5z m205 -561 c66 -38 166 -95 223 -127 l102 -58 0 -262 c0 -262 0 -263 -22 -276 -13 -8 -52 -31 -88 -51 -36 -21 -126 -72 -200 -115 l-135 -78 -3 261 -3 261 -166 95 c-91 52 -190 109 -219 125 -30 17 -52 34 -51 39 3 9 424 256 437 255 3 0 59 -31 125 -69z"></path></g></svg> {{.T.Get "OpenAdmin"}}</a>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var currentHost = window.location.hostname;
            var newPort = '{{.AdminPort}}';
            var currentUsername = '{{.CurrentUsername}}';
            var adminUrl = 'http://' + currentHost + ':' + newPort + '/users/' + encodeURIComponent(currentUsername);

            var link = document.getElementById('admin-return-link');

            link.addEventListener('click', function(e) {
                e.preventDefault();

                fetch('/logout')
                    .finally(() => {
                        window.location.href = adminUrl;
                    });
            });
        });
    </script>
</div>
{{end}}{{end}}
