{{define "ai_assistant"}}<!-- START templates/partials/_ai_assistant.html -->
<button type="button" id="ai-assistant-btn" title="{{.T.Get "AI Assistant"}}" aria-label="{{.T.Get "AI Assistant"}}" aria-controls="ai-assistant-drawer" aria-expanded="false"
  class="inline-flex h-8 min-w-8 px-1.5 shrink-0 items-center justify-center rounded-md text-gray-500 transition hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800/80 dark:hover:text-gray-50 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 text-xs font-semibold">
  <span class="ai-btn-label">AI</span>
</button>

<div id="ai-assistant-drawer" class="ai-drawer" role="dialog" aria-modal="false" aria-labelledby="ai-assistant-title" hidden
  data-strings="{{toJSON (dict
    "greeting" (.T.Get "Hi! Ask me anything about your hosting account and this panel.")
    "placeholder" (.T.Get "Ask a question...")
    "thinking" (.T.Get "Thinking...")
    "error" (.T.Get "Something went wrong, please try again.")
    "notConfigured" (.T.Get "The AI Assistant is not configured yet, please contact your hosting provider.")
    "usage" (.T.Get "Requests this month")
    "unlimited" (.T.Get "unlimited")
    "s1" (.T.Get "How do I add a new domain?")
    "s2" (.T.Get "How do I create an email account?")
    "s3" (.T.Get "How do I install WordPress?")
    "s4" (.T.Get "What can I do on this page?")
    "s5" (.T.Get "Which domains do I have?")
    "s6" (.T.Get "Create an email account for me")
    "change" (.T.Get "Change")
    "destructive" (.T.Get "Destructive")
    "approve" (.T.Get "Approve")
    "always" (.T.Get "Always allow")
    "deny" (.T.Get "Decline")
    "destructiveNote" (.T.Get "This can delete or overwrite data. Check the details before you approve.")
    "taintedNote" (.T.Get "Asking again because the assistant read files or logs in this chat.")
    "state_approved" (.T.Get "Approved")
    "state_declined" (.T.Get "Declined")
    "state_skipped" (.T.Get "Not answered")
    "state_expired" (.T.Get "Expired")
    "mode_off" (.T.Get "It answers questions using the panel documentation. It can't see your data or make changes for you.")
    "mode_read" (.T.Get "It answers questions using the panel documentation and can look up information in your account, but it can't make changes.")
    "mode_all" (.T.Get "It answers questions and can look up information or make changes in your account. Changes only run after you approve them, and everything it does is recorded in your Activity log.")
    "allowedTitle" (.T.Get "Always allowed actions")
    "allowedNone" (.T.Get "None yet. Click Always allow on an action to skip the approval next time. Actions that delete or overwrite data always ask.")
    "forget" (.T.Get "Remove")
  )}}">
  <div class="ai-drawer-head">
    <div class="ai-drawer-title">
      <span class="ai-badge">AI</span>
      <span id="ai-assistant-title">{{.T.Get "AI Assistant"}}</span>
    </div>
    <div class="ai-drawer-actions">
      <button type="button" id="ai-assistant-info" title="{{.T.Get "About"}}" aria-label="{{.T.Get "About"}}">
        <i class="ri-information-line text-lg leading-none" aria-hidden="true"></i>
      </button>
      <button type="button" id="ai-assistant-clear" title="{{.T.Get "New chat"}}" aria-label="{{.T.Get "New chat"}}">
        <i class="ri-delete-bin-line text-lg leading-none" aria-hidden="true"></i>
      </button>
      <button type="button" id="ai-assistant-close" title="{{.T.Get "Close"}}" aria-label="{{.T.Get "Close"}}">
        <i class="ri-close-line text-lg leading-none" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div id="ai-assistant-about" class="ai-about" hidden>
    <p data-ai-mode></p>
    <p>{{.T.Get "AI can make mistakes, double-check important steps before you apply them."}}</p>
    <p class="ai-usage"><span data-ai-usage-label></span>: <strong data-ai-usage></strong></p>
    <div data-ai-allowed></div>
  </div>

  <div id="ai-assistant-messages" class="ai-messages" aria-live="polite"></div>

  <form id="ai-assistant-form" class="ai-form">
    <textarea id="ai-assistant-input" rows="2" maxlength="4000" data-no-live-validate aria-label="{{.T.Get "Ask a question..."}}"></textarea>
    <button type="submit" id="ai-assistant-send" title="{{.T.Get "Send"}}" aria-label="{{.T.Get "Send"}}">
      <i class="ri-send-plane-2-line text-lg leading-none" aria-hidden="true"></i>
    </button>
  </form>
  <p class="ai-foot">{{.T.Get "AI can make mistakes."}}</p>
</div>

<style>
#ai-assistant-btn[aria-expanded="true"]{color:var(--color-blue-500);background:color-mix(in oklab,var(--color-blue-500) 10%,transparent)}
.ai-btn-label{letter-spacing:.04em}
.ai-drawer{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(420px,100vw);display:flex;flex-direction:column;background:var(--color-white);color:var(--color-gray-900);border-left:1px solid var(--color-gray-200);box-shadow:-8px 0 24px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .2s ease}
.ai-drawer.ai-open{transform:translateX(0)}
.dark .ai-drawer{background:var(--color-gray-950);color:var(--color-gray-50);border-left-color:var(--color-gray-800)}
.ai-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--color-gray-200)}
.dark .ai-drawer-head,.dark .ai-form,.dark .ai-about{border-color:var(--color-gray-800)}
.ai-drawer-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.ai-badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--color-blue-500);color:var(--color-white)}
.ai-drawer-actions{display:flex;gap:2px}
.ai-drawer-actions button{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:4px;color:var(--color-gray-500)}
.ai-drawer-actions button:hover{background:var(--color-gray-100);color:var(--color-gray-900)}
.dark .ai-drawer-actions button:hover{background:var(--color-gray-800);color:var(--color-gray-50)}
.ai-about{padding:12px 14px;border-bottom:1px solid var(--color-gray-200);font-size:13px;line-height:1.5;color:var(--color-gray-600);background:var(--color-gray-50)}
.ai-about p+p{margin-top:6px}
.dark .ai-about{background:var(--color-gray-900);color:var(--color-gray-400)}
.ai-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.55}
.ai-msg{max-width:92%;padding:8px 12px;border-radius:6px;overflow-wrap:anywhere}
.ai-msg-user{align-self:flex-end;background:var(--color-blue-500);color:var(--color-white);white-space:pre-wrap}
.ai-msg-assistant{align-self:flex-start;background:var(--color-gray-100)}
.dark .ai-msg-assistant{background:var(--color-gray-900)}
.ai-msg-error{align-self:flex-start;background:var(--color-red-50);color:var(--color-red-700)}
.dark .ai-msg-error{background:rgba(127,29,29,.3);color:var(--color-red-300)}
.ai-msg-assistant p,.ai-msg-assistant ul,.ai-msg-assistant ol,.ai-msg-assistant pre,.ai-msg-assistant h4{margin:0 0 8px}
.ai-msg-assistant>:last-child{margin-bottom:0}
.ai-msg-assistant ul{list-style:disc;padding-left:20px}
.ai-msg-assistant ol{list-style:decimal;padding-left:20px}
.ai-msg-assistant h4{font-weight:600}
.ai-msg-assistant a{color:var(--color-blue-500);text-decoration:underline}
.ai-msg-assistant code{font-size:12.5px;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.06)}
.dark .ai-msg-assistant code{background:rgba(255,255,255,.08)}
.ai-msg-assistant pre{padding:8px 10px;border-radius:6px;background:var(--color-gray-900);color:var(--color-gray-50);overflow-x:auto}
.ai-msg-assistant pre code{background:none;padding:0;color:inherit}
.ai-thinking{color:var(--color-gray-500);font-style:italic}
.ai-suggestions{display:flex;flex-wrap:wrap;gap:6px}
.ai-suggestions button{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--color-gray-200);color:var(--color-gray-700);background:var(--color-white);text-align:left}
.ai-suggestions button:hover{border-color:var(--color-blue-500);color:var(--color-blue-500)}
.dark .ai-suggestions button{background:var(--color-gray-950);border-color:var(--color-gray-700);color:var(--color-gray-300)}
.ai-form{display:flex;align-items:flex-end;gap:8px;padding:10px 14px 4px;border-top:1px solid var(--color-gray-200)}
.ai-form textarea{flex:1;resize:none;max-height:160px;font-size:14px;padding:8px 10px;border-radius:6px;border:1px solid var(--color-gray-300);background:var(--color-white);color:inherit;outline:none}
.ai-form textarea:focus{border-color:var(--color-blue-500);box-shadow:0 0 0 2px color-mix(in oklab,var(--color-blue-500) 20%,transparent)}
.dark .ai-form textarea{background:var(--color-gray-950);border-color:var(--color-gray-700)}
.ai-form button{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:6px;background:var(--color-blue-500);color:var(--color-white)}
.ai-form button:disabled{opacity:.5;cursor:not-allowed}
.ai-allowed-title{font-weight:600;color:var(--color-gray-900);margin-top:8px}
.dark .ai-allowed-title{color:var(--color-gray-50)}
.ai-allowed-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.ai-allowed-row button{font-size:12px;color:var(--color-red-700);text-decoration:underline;flex-shrink:0}
.ai-action{align-self:flex-start;font-size:12.5px;color:var(--color-emerald-700);padding:0 4px}
.ai-action-failed,.ai-action-declined{color:var(--color-red-700)}
.dark .ai-action{color:var(--color-emerald-400)}
.dark .ai-action-failed,.dark .ai-action-declined{color:var(--color-red-300)}
.ai-card{align-self:stretch;border:1px solid var(--color-blue-200);border-radius:6px;padding:10px 12px;background:var(--color-blue-50);font-size:13px}
.ai-card-destructive{border-color:var(--color-red-200);background:var(--color-red-50)}
.dark .ai-card{background:color-mix(in oklab,var(--color-blue-400) 10%,transparent);border-color:var(--color-blue-900)}
.dark .ai-card-destructive{background:rgba(127,29,29,.25);border-color:var(--color-red-900)}
.ai-card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-card-kind{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--color-blue-500);color:var(--color-white)}
.ai-card-destructive .ai-card-kind{background:var(--color-red-600)}
.ai-card-req{display:block;margin-top:6px;font-size:12px;overflow-wrap:anywhere;color:var(--color-gray-600)}
.dark .ai-card-req{color:var(--color-gray-400)}
.ai-card-fields{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0;font-size:12.5px}
.ai-card-fields dt{color:var(--color-gray-500)}
.ai-card-fields dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.ai-card-note{margin-top:8px;font-size:12px;color:var(--color-red-700)}
.dark .ai-card-note{color:var(--color-red-300)}
.ai-card-state{margin-top:8px;font-size:12px;color:var(--color-gray-500)}
.ai-card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai-card-actions button{font-size:12.5px;padding:5px 12px;border-radius:6px;border:1px solid var(--color-gray-300);background:var(--color-white);color:var(--color-gray-700)}
.dark .ai-card-actions button{background:var(--color-gray-950);border-color:var(--color-gray-700);color:var(--color-gray-300)}
.ai-card-actions .ai-btn-primary{background:var(--color-blue-500);border-color:var(--color-blue-500);color:var(--color-white)}
.dark .ai-card-actions .ai-btn-primary{background:var(--color-blue-500);border-color:var(--color-blue-500);color:var(--color-white)}
.ai-card-destructive .ai-card-actions .ai-btn-primary{background:var(--color-red-600);border-color:var(--color-red-600)}
.dark .ai-card-destructive .ai-card-actions .ai-btn-primary{background:var(--color-red-600);border-color:var(--color-red-600)}
.ai-foot{font-size:11px;color:var(--color-gray-400);text-align:center;padding:2px 14px 8px}
</style>
<script defer src="{{static "js/ai-assistant.js"}}"></script>
<!-- END templates/partials/_ai_assistant.html -->
{{end}}
