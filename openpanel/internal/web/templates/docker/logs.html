{{define "alpine_plugins"}}{{end}}
{{define "flowbite_js"}}{{end}}

{{define "content"}}
<!-- START templates/docker/logs.html -->

    <div x-data="{ showSection: false }" class="border-b border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-950 sm:p-6 lg:p-8">
        <header>
            <div class="flex flex-col gap-2 text-center sm:flex-row sm:items-center sm:justify-between sm:text-start">
                <div class="grow">
                    <h1 class="mb-1 text-xl font-bold">{{.T.Get "Logs"}}</h1>
                    <h2 class="text-sm font-medium text-slate-500">{{.T.Get "View Docker container logs."}}</h2>
                </div>
                <div class="flex flex-none items-center justify-center gap-2 rounded-sm px-2 sm:justify-end sm:bg-transparent sm:px-0">




        <div class="flex space-x-4 mt-4 md:mt-0">
            {{/* opened from a service's Logs tab, the service is already picked */}}
            <div{{if .ServiceTool}} class="hidden"{{end}}>
                <select id="log-select" class="group/trigger flex w-full select-none items-center justify-between gap-2 truncate rounded border px-3 py-2 shadow-sm outline-none transition sm:text-sm border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-50 data-[placeholder]:text-gray-500 data-[placeholder]:dark:text-gray-500 bg-white dark:bg-gray-950 hover:bg-gray-50 hover:dark:bg-gray-950/50 data-[disabled]:bg-gray-100 data-[disabled]:text-gray-400 data-[disabled]:dark:border-gray-700 data-[disabled]:dark:bg-gray-800 data-[disabled]:dark:text-gray-500 focus:ring-2 focus:ring-blue-200 focus:dark:ring-blue-700/30 focus:border-blue-500 focus:dark:border-blue-700">
                    <option disabled selected value>{{.T.Get "-- Select container --"}}</option>
                    {{range .Services}}
                                <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
            <div>
                <select id="lines-select" class="group/trigger flex w-full select-none items-center justify-between gap-2 truncate rounded border px-3 py-2 shadow-sm outline-none transition sm:text-sm border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-50 data-[placeholder]:text-gray-500 data-[placeholder]:dark:text-gray-500 bg-white dark:bg-gray-950 hover:bg-gray-50 hover:dark:bg-gray-950/50 data-[disabled]:bg-gray-100 data-[disabled]:text-gray-400 data-[disabled]:dark:border-gray-700 data-[disabled]:dark:bg-gray-800 data-[disabled]:dark:text-gray-500 focus:ring-2 focus:ring-blue-200 focus:dark:ring-blue-700/30 focus:border-blue-500 focus:dark:border-blue-700">
                    <option disabled selected value> {{.T.Get "-- Lines --"}} </option>
                    <option value="20">20</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option selected value="1000">1000</option>
                    <option value="2000">2000</option>
                    <option value="999999">{{.T.Get "All"}}</option>
                </select>
            </div>
        </div>



                </div>
            </div>
    </header>
    </div>



<div class="p-4 sm:p-6 lg:p-8" x-data="{ rawMode: false }">

    <div class="flex items-center justify-between mb-4">
        <h3 id="log-title" class="font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Select a container to view its logs here."}}</h3>
        <div class="flex space-x-2">
            <button type="button" title="{{.T.Get "Change view"}}"
                class="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600"
                @click="rawMode = !rawMode; window.__logRawMode = rawMode; renderLog(window.__loadedLog, rawMode)"
                x-text="rawMode ? {{toJSON (.T.Get "Formatted view")}} : {{toJSON (.T.Get "Raw view")}}">
            </button>
            <button type="button" title="{{.T.Get "Copy to clipboard"}}"
                class="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600"
                onclick="copyLog()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z"/><path d="M2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/></svg>
            </button>
            <button type="button" title="{{.T.Get "Open log in new tab"}}"
                class="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600"
                onclick="openLogInNewTab()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up-right" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M14 2.5a.5.5 0 0 0-.5-.5h-6a.5.5 0 0 0 0 1h4.793L2.146 13.146a.5.5 0 0 0 .708.708L13 3.707V8.5a.5.5 0 0 0 1 0z"/></svg>
            </button>
        </div>
    </div>

<style>
.text-red-900 {color: hsl(358, 66%, 48%)}
.bg-red-200 { background-color: hsl(0, 100%, 96%)}
.text-amber-900 { color: hsl(30, 100%, 32%)}
.bg-amber-200 { background-color: hsl(44, 100%, 92%)}
</style>

    <div id="log-content" class="overflow-y-auto p-2 rounded border border-dashed border-gray-300 dark:border-gray-800 text-sm" style="height: 65vh"></div>

</div>

<script>
const logsI18n = {
    emptyLog: {{toJSON (.T.Get "The log file is empty.")}},
    fetchError: {{toJSON (.T.Get "Error fetching log data.")}},
    title: {{toJSON (.T.Get "Logs")}},
    copied: {{toJSON (.T.Get "Logs copied to clipboard.")}},
    copyFailed: {{toJSON (.T.Get "Failed to copy logs.")}}
};

function logURL() {
    const logName = document.getElementById('log-select').value;
    const linesValue = document.getElementById('lines-select').value;
    let url = `/containers/logs/${encodeURIComponent(logName)}`;
    if (linesValue !== 'ALL') {
        url += `?lines=${linesValue}`;
    }
    return url;
}

// SHOW LOG FILE CONTENT
function fetchLog() {
    const logName = document.getElementById('log-select').value;
    if (!logName) return;
    fetch(logURL())
        .then(response => response.text())
        .then(text => {
            document.getElementById('log-title').textContent = logsI18n.title + ': ' + logName;
            window.__loadedLog = text.trim();
            renderLog(window.__loadedLog, window.__logRawMode);
        })
        .catch(error => {
            console.error('Error fetching log:', error);
            document.getElementById('log-content').textContent = logsI18n.fetchError;
        });
}

// formatted view highlights error and warning lines, raw view shows the log as-is
function renderLog(text, rawMode) {
    const box = document.getElementById('log-content');
    box.innerHTML = '';
    const pre = document.createElement('pre');
    pre.className = 'whitespace-pre-wrap';
    if (!text) {
        pre.textContent = logsI18n.emptyLog;
    } else if (rawMode) {
        pre.textContent = text;
    } else {
        text.split('\n').forEach(line => {
            const span = document.createElement('span');
            span.textContent = line + '\n';
            if (/\b(error|fatal|panic|crit(ical)?|emerg(ency)?|alert|exception)\b/i.test(line)) {
                span.classList.add('text-red-900', 'bg-red-200');
            } else if (/\bwarn(ing)?\b/i.test(line)) {
                span.classList.add('text-amber-900', 'bg-amber-200');
            }
            pre.appendChild(span);
        });
    }
    box.appendChild(pre);
    box.scrollTop = box.scrollHeight;
}

function copyLog() {
    if (!window.__loadedLog) return;
    copyToClipboard(window.__loadedLog)
        .then(() => showToast(logsI18n.copied, "success"))
        .catch(err => {
            console.error("Clipboard copy failed:", err);
            showToast(logsI18n.copyFailed, "warning");
        });
}

function openLogInNewTab() {
    if (!document.getElementById('log-select').value) return;
    window.open(logURL(), "_blank");
}

document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const containerParam = urlParams.get('container');
    const linesParam = urlParams.get('lines');

    if (containerParam) {
        document.getElementById('log-select').value = containerParam;
        if (linesParam) {
            document.getElementById('lines-select').value = linesParam;
        }
        fetchLog();
    }

    document.getElementById('log-select').addEventListener('change', fetchLog);
    document.getElementById('lines-select').addEventListener('change', fetchLog);
});
</script>


<!-- END templates/docker/logs.html -->
{{end}}
