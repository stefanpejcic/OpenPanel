{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/emails/info.html -->

<div class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8 border-b border-gray-200 mb-6 dark:border-gray-800">
    <div class="min-w-0">
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Connect devices"}}</h1>
        <p class="mt-1 text-sm text-gray-500 max-w-3xl">{{.T.Get "View email server information for account"}} <span class="punycode font-medium text-gray-900 dark:text-gray-50">{{.Address}}</span></p>
    </div>
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
        <a href="/emails" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60"><i class="ri-arrow-left-line -ml-1 text-base text-gray-500" aria-hidden="true"></i>{{.T.Get "Back to emails"}}</a>
    </div>
</div>

<div id="toAddActive">
{{template "email_created" .}}
</div>

<!-- END templates/emails/info.html -->
{{end}}
