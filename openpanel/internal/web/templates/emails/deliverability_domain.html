{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/emails/deliverability_domain.html -->

<!-- page header -->
<div class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
    <div>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Email deliverability"}}</h1>
        <p class="mt-1 text-sm text-gray-500 punycode">{{.Domain}}</p>
    </div>
    <a href="/emails/deliverability" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600 sm:w-fit">
        <i class="ri-arrow-left-line" aria-hidden="true"></i> {{.T.Get "Back to deliverability"}}
    </a>
</div>
<!-- END page header -->

<div class="max-w-3xl px-4 pb-8 sm:px-6 lg:px-8" id="deliverabilityDetail">
    <div class="flex items-center justify-center gap-2 rounded-md border border-gray-200 p-8 text-sm text-gray-500 dark:border-gray-800" id="deliverabilityLoading">
        <i class="ri-loader-4-line animate-spin" aria-hidden="true"></i> {{.T.Get "Checking DNS records..."}}
    </div>

    <div id="deliverabilityResult" class="hidden space-y-6"></div>
</div>

<script>
function recordTable(label, record) {
    const map = {
        ok: ['bg-emerald-50 text-emerald-900 ring-emerald-600/30 dark:bg-emerald-400/10 dark:text-emerald-400 dark:ring-emerald-400/20', 'OK'],
        missing: ['bg-red-50 text-red-900 ring-red-600/20 dark:bg-red-400/10 dark:text-red-400 dark:ring-red-400/20', 'Missing'],
        mismatch: ['bg-yellow-50 text-yellow-900 ring-yellow-600/30 dark:bg-yellow-400/10 dark:text-yellow-500 dark:ring-yellow-400/20', 'Mismatch'],
        wrong_ip: ['bg-yellow-50 text-yellow-900 ring-yellow-600/30 dark:bg-yellow-400/10 dark:text-yellow-500 dark:ring-yellow-400/20', '{{.T.Get "Wrong IP"}}'],
    };
    const [cls, statusLabel] = map[record.status] || ['bg-gray-50 text-gray-900 ring-gray-500/30 dark:bg-gray-400/10 dark:text-gray-400 dark:ring-gray-400/20', record.status];

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value || '';
        return div.innerHTML;
    }

    return `
        <div>
            <div class="mb-2 flex items-center justify-between">
                <h2 class="text-sm font-semibold text-gray-900 dark:text-gray-50">${label}</h2>
                <span class="inline-flex items-center gap-x-1 whitespace-nowrap rounded-md px-2 py-1 text-xs font-medium ring-1 ring-inset ${cls}">${statusLabel}</span>
            </div>
            <dl class="divide-y divide-gray-200 rounded-md border border-gray-200 text-sm dark:divide-gray-800 dark:border-gray-800">
                <div class="flex flex-col gap-1 px-4 py-3 sm:flex-row sm:gap-4">
                    <dt class="w-28 shrink-0 text-gray-500">{{.T.Get "Current"}}</dt>
                    <dd class="font-mono text-xs break-all text-gray-900 dark:text-gray-50">${record.current ? escapeHtml(record.current) : '<span class="text-gray-400 dark:text-gray-600">' + {{toJSON (.T.Get "Not found")}} + '</span>'}</dd>
                </div>
                <div class="flex flex-col gap-1 px-4 py-3 sm:flex-row sm:gap-4">
                    <dt class="w-28 shrink-0 text-gray-500">{{.T.Get "Expected"}}</dt>
                    <dd class="font-mono text-xs break-all text-gray-900 dark:text-gray-50">${record.expected ? escapeHtml(record.expected) : '<span class="text-gray-400 dark:text-gray-600">—</span>'}</dd>
                </div>
            </dl>
        </div>
    `;
}

document.addEventListener('DOMContentLoaded', function () {
    fetch('/emails/deliverability/{{.Domain}}?output=json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('deliverabilityLoading').classList.add('hidden');
            const result = document.getElementById('deliverabilityResult');
            result.classList.remove('hidden');
            result.innerHTML =
                recordTable('SPF', data.spf) +
                recordTable('DKIM', data.dkim) +
                recordTable('DMARC', data.dmarc);
        })
        .catch(function (err) {
            document.getElementById('deliverabilityLoading').textContent = {{toJSON (.T.Get "Failed to check DNS records.")}};
            console.error('Failed to load deliverability status', err);
        });
});
</script>

<!-- END templates/emails/deliverability_domain.html -->
{{end}}
