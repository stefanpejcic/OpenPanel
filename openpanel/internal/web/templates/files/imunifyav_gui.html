{{define "page_tabs_right"}}

<iframe id="imunifyav-gui" title="ImunifyAV" src="/imav/#/login?token={{.Token}}" class="block w-full border-0" style="height: calc(100vh - {{if .PageTabs}}5rem{{else}}7.5rem{{end}});"></iframe>
