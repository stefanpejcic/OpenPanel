{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/files/ftp_path.html -->

<!-- page header -->
<section aria-label="FTP Path Header" x-data="{ searchQuery: '' }">
    <div class="border-b flex flex-col border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-950 p-4 sm:p-6 lg:p-8 sm:flex-row sm:items-center sm:justify-between">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "FTP Path"}}</h1></div>
        <p class="text-sm text-gray-500 dark:text-gray-500">{{.T.Get "Change FTP path for user"}} {{.Username}}</p>
    </div>
    <div class="mt-2 gap-2 sm:mt-0 sm:flex">
    </div>
</div>
<!-- END page header -->


<!-- form -->
<div class="sm:mx-auto sm:max-w-2xl p-6 m-6 CrawlerStatusCard" id="toAddActive">
    <form class="mt-8" method="POST">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

    <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">

                  <input type="hidden" id="username" name="username"  value="{{.Username}}">

            <div class="col-span-full">
              <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{.T.Get "New Path"}}<span class="text-red-500 dark:text-red-500">*</span></label>
              <div class="flex rounded-lg shadow-sm"
                    x-data="{
                        value: '/var/www/html/',
                        error: false,
                        i18n: {
                            mustStartWith: '{{.T.Get "Path must start with /var/www/html/"}}',
                            noTraversal: '{{.T.Get "Path traversal (../) is not allowed"}}'
                        }
                    }">
                <input required type="text" id="new_path" name="new_path" placeholder="/var/www/html/" title="{{.T.Get "Path must be under"}} /var/www/html/" class="py-2 px-3 pe-11 block w-full border-gray-200 shadow-sm rounded-l-lg text-sm focus:z-10 focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
    @input="
      if (!value.startsWith('/var/www/html/')) {
        error = true;
        errorMessage = i18n.mustStartWith;
      } else if (value.includes('../')) {
        error = true;
        errorMessage = i18n.noTraversal;
      } else {
        error = false;
        errorMessage = '';
      }
    ">

  <template x-if="error">
        <p class="mt-1 text-sm text-red-600 dark:text-red-400" x-text="errorMessage"></p>
  </template>



              </div>
            </div>

        </div>

        <div class="mx-auto my-6 flex w-full items-center justify-between gap-3 text-sm text-gray-500 dark:text-gray-500"><div class="h-[1px] w-full bg-gray-200 dark:bg-gray-800"></div></div>



<div class="md:flex items-center md:justify-end md:space-x-4">
    <button type="submit" class="relative inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-offset-2 outline-0 focus-visible:outline-2 outline-blue-500 dark:outline-blue-500 dark:border-gray-800 dark:text-gray-50 dark:bg-gray-950 dark:hover:bg-gray-900/60 disabled:text-gray-400 disabled:dark:text-gray-600 mt-2 w-full sm:w-auto gap-x-1.5 whitespace-nowrap border-black bg-black text-white hover:bg-gray-800 sm:mt-0">{{.T.Get "Update"}}<svg class="w-3.5 h-3.5 ms-2 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"></path></svg></button>
</div>

    </form>
</div>
<!-- END form -->

<!-- END templates/files/ftp_path.html -->
{{end}}
