{{define "main_class"}}op-scope{{end}}
{{define "page_tabs"}}{{template "op_page_tabs" .}}{{end}}
{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/files/ftp_path.html -->

<!-- page header -->
<section aria-label="{{.T.Get "FTP Path Header"}}" x-data="{ searchQuery: '' }">
    <div class="op-page-head op-cms-head">
        <div>
        <div class="op-wp-title"><h1 class="op-title">{{.T.Get "FTP Path"}}</h1></div>
        <p class="op-meta">{{.T.Get "Change FTP path for user"}} {{.Username}}</p>
    </div>
    <div class="op-actions">
    </div>
</div>
<!-- END page header -->


<!-- form -->
<div class="op-card op-block-card CrawlerStatusCard" id="toAddActive">
    <form class="mt-8" method="POST">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

    <div class="op-form-grid">

                  <input type="hidden" id="username" name="username"  value="{{.Username}}">

            <div class="op-field-wrap">
              <label for="password" class="op-label op-label-row">{{.T.Get "New Path"}}<span class="is-danger">*</span></label>
              <div class="op-join"
                    x-data="{
                        error: false,
                        errorMessage: '',
                        i18n: {
                            mustStartWith: '{{.T.Get "Path must start with /var/www/html/"}}',
                            noTraversal: '{{.T.Get "Path traversal (../) is not allowed"}}'
                        }
                    }">
                <input required type="text" id="new_path" name="new_path" placeholder="/var/www/html/" title="{{.T.Get "Path must be under"}} /var/www/html/" class="pe-11 block w-full op-input"
    @input="
      if (!$el.value.startsWith('/var/www/html/')) {
        error = true;
        errorMessage = i18n.mustStartWith;
      } else if ($el.value.includes('../')) {
        error = true;
        errorMessage = i18n.noTraversal;
      } else {
        error = false;
        errorMessage = '';
      }
    ">

  <template x-if="error">
        <p class="mt-1 text-sm is-danger" x-text="errorMessage"></p>
  </template>



              </div>
            </div>

        </div>

        <div class="op-sep"><div class="op-divider"></div></div>



<div class="op-actions op-actions-end">
    <button type="submit" class="op-btn op-btn-primary">{{.T.Get "Update"}}<svg class="w-3.5 h-3.5 ms-2 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"></path></svg></button>
</div>

    </form>
</div>
<!-- END form -->

<!-- END templates/files/ftp_path.html -->
{{end}}
