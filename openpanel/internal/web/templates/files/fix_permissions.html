{{define "alpine_plugins"}}{{end}}
{{define "flowbite_js"}}{{end}}

{{define "content"}}
<!-- START templates/files/fix_permissions.html -->

<!-- page header -->
<section aria-label="Files Header" x-data="{ searchQuery: '' }">
    <div class="border-b flex flex-col border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-950 p-4 sm:p-6 lg:p-8 sm:flex-row sm:items-center sm:justify-between">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Fix Permissions"}}</h1></div>
        <p class="text-sm text-gray-500 dark:text-gray-500">{{.T.Get "Fix and reset permissions for files and folders under"}} /var/www/html/</p>
    </div>
    <div class="mt-2 gap-2 sm:mt-0 sm:flex">
    </div>
</div>
<!-- END page header -->




<!-- form -->
<div class="sm:mx-auto sm:max-w-2xl p-6 m-6 CrawlerStatusCard" id="toAddActive">
    <div class="mt-8">
        <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">

            <div class="col-span-full mb-5">
                <label for="directory-select" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{.T.Get "Choose a directory:"}}<span class="text-red-500 dark:text-red-500">*</span></label>

                <div class="flex rounded-lg shadow-sm">
                    <input type="text" id="directory-select" class="py-2 px-3 block w-full border-gray-200 shadow-sm rounded text-sm focus:z-10 focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600" value="/var/www/html/" placeholder="/var/www/html/" list="directory-options">
                    <datalist id="directory-options">
                        {{range .Directories}}
                            <option value="{{.}}">
                        {{end}}
                    </datalist>
                </div>
            </div>
      </div>

      <div class="mx-auto my-6 flex w-full items-center justify-between gap-3 text-sm text-gray-500 dark:text-gray-500"><div class="h-[1px] w-full bg-gray-200 dark:bg-gray-800"></div></div>


        <div class="md:flex items-center md:justify-end md:space-x-4">
            <button id="start-scan-btn" type="button" class="relative inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-offset-2 outline-0 focus-visible:outline-2 outline-blue-500 dark:outline-blue-500 dark:border-gray-800 dark:text-gray-50 dark:bg-gray-950 dark:hover:bg-gray-900/60 disabled:text-gray-400 disabled:dark:text-gray-600 mt-2 w-full sm:w-auto gap-x-1.5 whitespace-nowrap border-black bg-black text-white hover:bg-gray-800 sm:mt-0">{{.T.Get "Fix Permissions"}}<svg class="w-3.5 h-3.5 ms-2 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"></path>
                </svg>
            </button>

            <!-- Scanning Spinner Button (Initially hidden) -->
            <button id="scanning-btn" tabindex="-1" type="button" style="display: none;" disabled class="relative inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-offset-2 outline-0 focus-visible:outline-2 outline-blue-500 dark:outline-blue-500 dark:border-gray-800 dark:text-gray-50 dark:bg-gray-950 dark:hover:bg-gray-900/60 disabled:text-gray-400 disabled:dark:text-gray-600 mt-2 w-full sm:w-auto gap-x-1.5 whitespace-nowrap border-black bg-black text-white hover:bg-gray-800 sm:mt-0">

<svg aria-hidden="true" role="status" class="inline w-4 h-4 me-3 text-white animate-spin" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="#E5E7EB"/><path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentColor"/>
</svg> {{.T.Get "Working..."}}
            </button>
        </div>
    </div>
</div>
<!-- END form -->

<!-- Fix Complete Message (Initially hidden) -->
<div id="scan-complete-message" class="m-4 alert alert-success" style="display: none;">{{.T.Get "Permissions are fixed!"}}</div>


<script>
    function showScanCompleteMessage() {
        document.getElementById('scan-complete-message').style.display = 'block';
    }

    document.getElementById('start-scan-btn').addEventListener('click', function () {
        document.getElementById('start-scan-btn').style.display = 'none';
        document.getElementById('scanning-btn').style.display = 'flex';

        const selectedDirectory = document.getElementById('directory-select').value;

        toastMessage = "{{.T.Get "The process has started. This may take a few minutes depending on the number of files and folders in the specified path. Please wait."}}";
        showToast(toastMessage, 'success');

        document.getElementById('scan-complete-message').style.display = 'none';

    fetch(`/fix-permissions`, {
        method: 'POST',
        headers: {
            'X-CSRF-Token': csrf_token,
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `directory=${encodeURIComponent(selectedDirectory)}`,
    })
        .then(response => {
            if (!response.ok) {
                throw new Error('{{.T.Get "Network response was not ok"}}');
            }
            return response.text();
        })
        .then(data => {
            console.log(data);
            showScanCompleteMessage();
        })
        .catch(error => {
            console.error('Fixing permissions failed:', error);
            toastMessage = '{{.T.Get "Fixing permissions failed"}}';
            showToast(toastMessage, 'error');
        })
        .finally(() => {
            toastMessage = '{{.T.Get "Permissions successfully fixed for all files and subdirectories inside the directory"}} ' + selectedDirectory;
            showToast(toastMessage, 'success');

            document.getElementById('scanning-btn').style.display = 'none';
            document.getElementById('start-scan-btn').style.display = 'flex';
        });
    });
</script>

<!-- END templates/files/fix_permissions.html -->
{{end}}
