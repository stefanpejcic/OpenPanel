{{define "alpine_plugins"}}{{end}}
{{define "flowbite_js"}}{{end}}

{{define "content"}}
<!-- START templates/files/fix_permissions.html -->

<!-- page header -->
<section aria-label="{{.T.Get "Files Header"}}" x-data="{ searchQuery: '' }">
    <div class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Fix permissions"}}</h1></div>
        <p class="mt-1 text-sm text-gray-500">{{.T.Get "Fix and reset permissions for files and folders under"}} <code class="rounded bg-gray-100 px-1 py-0.5 font-mono text-xs text-gray-900 dark:bg-gray-800 dark:text-gray-50">/var/www/html/</code></p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
    </div>
</div>
<!-- END page header -->




<!-- form -->
<div class="mx-4 mb-8 max-w-2xl sm:mx-6 lg:mx-8 rounded-md border border-gray-200 bg-white p-4 dark:border-gray-900 dark:bg-raised CrawlerStatusCard" id="toAddActive">
    <div>
        <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">

            {{template "folder_picker" .}}
      </div>


        <div class="mt-6 flex justify-end gap-2 border-t border-gray-200 pt-4 dark:border-gray-800">
            <button id="start-scan-btn" type="button" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-transparent bg-blue-500 text-white hover:bg-blue-600 disabled:bg-blue-300 dark:disabled:bg-blue-800 dark:disabled:text-blue-400"><i class="ri-key-2-line"></i> {{.T.Get "Fix permissions"}}
            </button>

            <!-- Scanning Spinner Button (Initially hidden) -->
            <button id="scanning-btn" tabindex="-1" type="button" style="display: none;" disabled class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-transparent bg-blue-500 text-white hover:bg-blue-600 disabled:bg-blue-300 dark:disabled:bg-blue-800 dark:disabled:text-blue-400">

<i class="ri-loader-4-line animate-spin" aria-hidden="true"></i> {{.T.Get "Working..."}}
            </button>
        </div>
    </div>
</div>
<!-- END form -->

<!-- Fix Complete Message (Initially hidden) -->
<div id="scan-complete-message" class="mx-4 mb-8 max-w-2xl sm:mx-6 lg:mx-8 flex gap-3 rounded-md p-4 text-sm bg-emerald-50 text-emerald-900 dark:bg-emerald-950/70 dark:text-emerald-500" role="status" style="display: none;"><i class="ri-checkbox-circle-line text-lg leading-5" aria-hidden="true"></i> <p>{{.T.Get "Permissions are fixed!"}}</p></div>


<script>
    function showScanCompleteMessage() {
        document.getElementById('scan-complete-message').style.display = 'flex';
    }

    document.getElementById('start-scan-btn').addEventListener('click', function () {
        document.getElementById('start-scan-btn').style.display = 'none';
        document.getElementById('scanning-btn').style.display = 'flex';

        const selectedDirectory = document.getElementById('directory-select').value;
        folderPicker.lock(true);

        toastMessage = "{{.T.Get "The process has started. This may take a few minutes depending on the number of files and folders in the specified path. Please wait."}}";
        showToast(toastMessage, 'success');

        document.getElementById('scan-complete-message').style.display = 'none';

    fetch(`/fix-permissions`, {
        method: 'POST',
        headers: {
            'X-CSRF-Token': csrf_token,
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `directory=${encodeURIComponent(selectedDirectory)}`,
    })
        .then(response => {
            // a redirect means nothing ran, e.g. the session expired and this is the login page
            if (!response.ok || response.redirected) {
                throw new Error('{{.T.Get "Network response was not ok"}}');
            }
            return response.text();
        })
        .then(data => {
            console.log(data);
            showScanCompleteMessage();
            toastMessage = '{{.T.Get "Permissions successfully fixed for all files and subdirectories inside the directory"}} ' + selectedDirectory;
            showToast(toastMessage, 'success');
        })
        .catch(error => {
            console.error('Fixing permissions failed:', error);
            toastMessage = '{{.T.Get "Fixing permissions failed"}}';
            showToast(toastMessage, 'error');
        })
        .finally(() => {
            folderPicker.lock(false);
            document.getElementById('scanning-btn').style.display = 'none';
            document.getElementById('start-scan-btn').style.display = 'flex';
        });
    });
</script>

<!-- END templates/files/fix_permissions.html -->
{{end}}
