    <!-- Upload Files Form -->

    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

<div class="flex items-center justify-center w-full">
    <label for="fileUpload"
           class="flex flex-col items-center justify-center w-full h-64 cursor-pointer py-6 op-surface">

        <div id="uploadText" class="flex flex-col items-center justify-center pt-5 pb-6 max-h-72 overflow-y-auto">
            <svg class="w-8 h-8 mb-4 op-muted" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 20 16">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
            </svg>
            <p class="mb-2 text-sm op-muted">
                <span class="font-semibold">{{.T.Get "Click to upload"}}</span> {{.T.Get "or drag and drop"}}
            </p>
            <p class="op-hint">{{.T.Get "Any file type (Multiple files allowed)"}}</p>
            {{if .FilemanagerUploadSize}}
            <p class="op-hint">{{.T.Get "Max size:"}} {{.FilemanagerUploadSize}} MB</p>
            {{end}}
        </div>

        <input id="fileUpload" name="fileUpload" type="file" class="hidden" multiple required />
    </label>
</div>

<script>
document.getElementById('fileUpload').addEventListener('change', function(event) {
    const files = Array.from(event.target.files);
    const uploadText = document.getElementById('uploadText');

    if (files.length) {
        uploadText.innerHTML = `
            <ul class="text-sm list-disc pl-5 op-muted">
                ${files.map(file => `<li>${file.name}</li>`).join('')}
            </ul>
        `;
    }
});

const dropArea = document.querySelector('label[for="fileUpload"]');
const fileInput = document.getElementById('fileUpload');
const uploadText = document.getElementById('uploadText');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, (e) => e.preventDefault());
    dropArea.addEventListener(eventName, (e) => e.stopPropagation());
});

['dragenter', 'dragover'].forEach(eventName => {
    dropArea.addEventListener(eventName, () => {
        dropArea.classList.add('is-dragover');
    });
});

['dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, () => {
        dropArea.classList.remove('is-dragover');
    });
});

dropArea.addEventListener('drop', (e) => {
    const droppedFiles = e.dataTransfer.files;
    if (droppedFiles.length) {
        fileInput.files = droppedFiles;
        fileInput.dispatchEvent(new Event('change'));
    }
});
</script>

<!-- js code to switch upload forms and process uploads -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const wgetForm = document.getElementById('wgetForm');
    const uploadForm = document.getElementById('uploadForm');
    const changeToWgetLink = document.getElementById('change_to_wget');
    const changeToUploadLink = document.getElementById('change_to_upload');

    function getCsrfToken() {
        const el = document.querySelector('input[name="csrf_token"]');
        return el ? el.value : '';
    }

    let uploadInProgress = false;
    let downloadInProgress = false;

    const STORAGE_KEY = `fm_wget_download_{{.PathParam}}`;
    let pollTimer = null;
    let currentDownloadId = null;
    let notFoundRetries = 0;

    function showDownloadUI(startHeaderText = '{{.T.Get "Starting download..."}}') {
        const progressDiv = document.getElementById('download-progress-div');
        const progressBar = document.getElementById('download-progress-bar-inner');
        const progressLabel = document.getElementById('download-progress-label');
        const progressHeader = document.getElementById('download-progress-header');

        progressDiv.classList.remove('hidden');
        progressDiv.style.display = 'block';
        progressBar.style.width = '0%';
        progressBar.setAttribute('aria-valuenow', 0);
        progressLabel.innerText = '0%';
        progressHeader.innerText = startHeaderText;
    }

    function updateDownloadUI(percent, headerText) {
        const progressBar = document.getElementById('download-progress-bar-inner');
        const progressLabel = document.getElementById('download-progress-label');
        const progressHeader = document.getElementById('download-progress-header');

        progressBar.style.width = `${percent}%`;
        progressBar.setAttribute('aria-valuenow', percent);
        progressLabel.innerText = `${percent}%`;
        if (headerText) progressHeader.innerText = headerText;
    }

    function setDownloadButtonsState(isDownloading) {
        changeToUploadLink.disabled = !!isDownloading;
        downloadInProgress = !!isDownloading;
    }

    function clearPollTimer() {
        if (pollTimer) {
            clearTimeout(pollTimer);
            pollTimer = null;
        }
    }

    function saveDownloadState(downloadId) {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
            download_id: downloadId,
            started_at: Date.now()
        }));
    }

    function loadDownloadState() {
        try {
            const raw = sessionStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    function clearDownloadState() {
        sessionStorage.removeItem(STORAGE_KEY);
        currentDownloadId = null;
        notFoundRetries = 0;
        clearPollTimer();
    }

    function scheduleNextPoll(downloadId, delayMs) {
        clearPollTimer();
        pollTimer = setTimeout(() => pollDownloadProgress(downloadId), delayMs);
    }

    function pollDownloadProgress(downloadId) {
        if (document.hidden) return;

        fetch(`/file-manager/wget/status/${downloadId}`, { cache: 'no-store' })
            .then(async (response) => {
                let data = {};
                try { data = await response.json(); } catch (e) {}

                if (response.status === 404 || data.error) {
                    notFoundRetries += 1;

                    const delay = Math.min(1000 * Math.pow(2, Math.min(notFoundRetries, 3)), 10000);

                    updateDownloadUI(
                        0,
                        '{{.T.Get "Reconnecting to download status..."}}'
                    );

                    if (notFoundRetries >= 8) {
                        const msg = (data && data.error) ? data.error : '{{.T.Get "Download not found."}}';
                        document.getElementById('download-progress-header').innerText = msg;
                        showToast(msg, 'error');
                        setDownloadButtonsState(false);
                        clearDownloadState();
                        return;
                    }

                    scheduleNextPoll(downloadId, delay);
                    return;
                }

                notFoundRetries = 0;

                const percent = data.progress || 0;
                updateDownloadUI(percent, data.message || '{{.T.Get "Download in progress..."}}');

                if (data.status === 'downloading' || data.status === 'queued' || data.status === 'starting') {
                    scheduleNextPoll(downloadId, 1000);
                } else if (data.status === 'done') {
                    document.getElementById('download-progress-header').innerText =
                        data.message || '{{.T.Get "Download finished successfully."}}';
                    showToast(data.message || '{{.T.Get "File downloaded successfully!"}}', 'success');

                    setDownloadButtonsState(false);
                    clearDownloadState();

                    setTimeout(() => {
                        const progressDiv = document.getElementById('download-progress-div');
                        progressDiv.style.display = 'none';
                    }, 5000);
                } else if (data.status === 'error') {
                    document.getElementById('download-progress-header').innerText =
                        data.message || '{{.T.Get "Download failed."}}';
                    showToast(data.message || '{{.T.Get "Error downloading file."}}', 'error');

                    setDownloadButtonsState(false);
                    clearDownloadState();
                } else {
                    document.getElementById('download-progress-header').innerText = '{{.T.Get "Unknown download status."}}';
                    setDownloadButtonsState(false);
                    clearDownloadState();
                }
            })
            .catch((error) => {
                console.error('Error polling download status:', error);

                notFoundRetries += 1;
                const delay = Math.min(1000 * Math.pow(2, Math.min(notFoundRetries, 3)), 10000);
                document.getElementById('download-progress-header').innerText = '{{.T.Get "Reconnecting..."}}';
                scheduleNextPoll(downloadId, delay);
            });
    }

    (function resumeIfNeeded() {
        const state = loadDownloadState();
        if (state && state.download_id) {
            currentDownloadId = state.download_id;
            showDownloadUI('{{.T.Get "Resuming download status..."}}');
            setDownloadButtonsState(true);
            pollDownloadProgress(currentDownloadId);
        }
    })();

    document.addEventListener('visibilitychange', () => {
        if (!currentDownloadId) return;

        if (document.hidden) {
            clearPollTimer();
        } else {
            pollDownloadProgress(currentDownloadId);
        }
    });

    wgetForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const fileInput = document.getElementById('fileWget');
        const url = fileInput.value.trim();

        if (!url) {
            showToast("{{.T.Get "Please enter a valid URL."}}", 'error');
            return;
        }

        const formData = new FormData();
        formData.append('url', url);

        const pathParam = "{{.PathParam}}";
        formData.append('path_param', pathParam);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/file-manager/wget', true);

        const csrf = getCsrfToken();
        if (csrf) xhr.setRequestHeader('X-CSRF-Token', csrf);

        showDownloadUI('{{.T.Get "Starting download..."}}');
        setDownloadButtonsState(true);

        xhr.onload = function () {
            if (xhr.status === 200) {
                let data;
                try {
                    data = JSON.parse(xhr.responseText);
                } catch (e) {
                    document.getElementById('download-progress-header').innerText = '{{.T.Get "Unexpected server response."}}';
                    showToast("{{.T.Get "Unexpected server response from download endpoint."}}", 'error');
                    setDownloadButtonsState(false);
                    return;
                }

                if (!data.download_id) {
                    document.getElementById('download-progress-header').innerText = '{{.T.Get "Missing download ID."}}';
                    showToast("{{.T.Get "Server did not return a download ID."}}", 'error');
                    setDownloadButtonsState(false);
                    return;
                }

                currentDownloadId = data.download_id;
                notFoundRetries = 0;
                saveDownloadState(currentDownloadId);

                pollDownloadProgress(currentDownloadId);
            } else {
                document.getElementById('download-progress-header').innerText = '{{.T.Get "Download request failed."}}';
                showToast("{{.T.Get "Error starting download:"}} " + xhr.statusText + ' - ' + xhr.responseText, "error");
                setDownloadButtonsState(false);
            }
        };

        xhr.onerror = function () {
            document.getElementById('download-progress-header').innerText = '{{.T.Get "Network error."}}';
            showToast("{{.T.Get "Network error during file download. Please try again."}}", 'error');
            setDownloadButtonsState(false);
        };

        xhr.send(formData);
    });

    // the limit is per file, one request can carry a few files so a bigger selection goes out as several requests
    const MAX_UPLOAD_SIZE_MB = {{.FilemanagerUploadSize}};
    const MAX_UPLOAD_SIZE_BYTES = MAX_UPLOAD_SIZE_MB * 1024 * 1024;
    const MAX_BATCH_BYTES = ({{.FilemanagerUploadBatchSize}} || Infinity) * 1024 * 1024;

    // uploadBatches splits files into requests under MAX_BATCH_BYTES, files over the per-file limit go in tooBig and are never sent
    function uploadBatches(files) {
        const batches = [], tooBig = [];
        let batch = [], bytes = 0;
        files.forEach(f => {
            if (MAX_UPLOAD_SIZE_BYTES && f.size > MAX_UPLOAD_SIZE_BYTES) {
                tooBig.push(f);
                return;
            }
            if (batch.length && bytes + f.size > MAX_BATCH_BYTES) {
                batches.push(batch);
                batch = [];
                bytes = 0;
            }
            batch.push(f);
            bytes += f.size;
        });
        if (batch.length) batches.push(batch);
        return { batches, tooBig };
    }

    uploadForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const fileInput = document.getElementById('fileUpload');
        const selected = Array.from(fileInput.files);
        if (selected.length === 0) {
            showToast("{{.T.Get "Please select files to upload."}}", 'warning');
            return;
        }
        const { batches, tooBig } = uploadBatches(selected);
        if (tooBig.length) {
            showToast('{{.T.Get "Over the %(size)s MB upload limit:"}}'.replace('%(size)s', MAX_UPLOAD_SIZE_MB) + ' ' + tooBig.map(f => f.name).join(', '), 'warning');
            return;
        }
        fileInput.value = '';

        changeToWgetLink.disabled = true;
        uploadInProgress = true;
        let next = 0;
        const sendNext = (cancelled) => {
            if (cancelled || next >= batches.length) {
                changeToWgetLink.disabled = false;
                uploadInProgress = false;
                return;
            }
            uploadBatch(batches[next++], sendNext);
        };
        sendNext(false);
    });

    // uploadBatch sends one request with its own progress row and calls done once it's over, done(true) when cancelled
    function uploadBatch(uploadFiles, done) {
        const uploadProgressContainer = document.getElementById('upload-progress-container');
        const classesToAdd = ['mt-6', 'border', 'rounded-xl', 'shadow-sm', 'p-6', 'dark:bg-neutral-800', 'dark:border-neutral-700'];
        classesToAdd.forEach(className => {
            if (!uploadProgressContainer.classList.contains(className)) {
                uploadProgressContainer.classList.add(className);
            }
        });

        const currentFileName = uploadFiles.length === 1 ? uploadFiles[0].name : `${uploadFiles.length} files`;
        const formData = new FormData();

        const pathParam = "{{.PathParam}}";
        formData.append('path_param', pathParam);

        for (let i = 0; i < uploadFiles.length; i++) {
            formData.append('files', uploadFiles[i]);
        }

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/file-manager/upload', true);

        const progressContainer = document.createElement('div');
        progressContainer.classList.add('op-upload-item');

        progressContainer.innerHTML = `
            <div class="op-upload-row">
                <span class="op-ico-tile is-sm" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg></span>
                <p class="upload-name op-strong op-truncate">${currentFileName}</p>
                <button type="button" class="op-icon-btn op-icon-btn-sm cancel-btn" aria-label="Cancel">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>
                </button>
            </div>
            <div class="op-upload-row">
                <div class="op-progress op-grow" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><span class="upload-bar" style="width: 0%"></span></div>
                <span class="upload-pct op-mono">0%</span>
            </div>
        `;

        document.getElementById('upload-progress-container').appendChild(progressContainer);

        const progressBar = progressContainer.querySelector('.upload-bar');
        const progressLabel = progressContainer.querySelector('.upload-pct');
        const cancelButton = progressContainer.querySelector('.cancel-btn');

        cancelButton.addEventListener('click', () => {
            xhr.abort();
                        progressBar.classList.add('is-danger');
            cancelButton.innerHTML = '<svg class="shrink-0 size-4 is-danger" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"> <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path> </svg>';
            done(true);
        });

        xhr.upload.onprogress = function (e) {
            if (e.lengthComputable) {
                const percent = (e.loaded / e.total) * 100;
                progressBar.style.width = percent + '%';
                progressBar.setAttribute('aria-valuenow', percent);
                progressLabel.innerText = Math.round(percent) + '%';
            }
        };

        xhr.onload = function () {
            if (xhr.status === 200) {
                progressContainer.querySelector('.upload-name').innerText = `${currentFileName} uploaded successfully`;
                showToast("{{.T.Get "Files uploaded successfully!"}}", 'success');
                                progressBar.classList.add('is-success');
                cancelButton.innerHTML = '<svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"> <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"></path> </svg>';
                cancelButton.classList.remove('cancel-btn');
                done(false);
            } else {
                                progressBar.classList.add('is-warning');
                showToast("{{.T.Get "Error uploading file:"}} " + xhr.statusText + ' - ' + xhr.responseText, "error");
                progressContainer.querySelector('.upload-name').innerText = `${currentFileName} upload failed`;
                cancelButton.innerHTML = '<svg class="shrink-0 size-4 is-danger" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"> <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path> </svg>';
                cancelButton.classList.remove('cancel-btn');
                done(false);
            }
        };

        xhr.onerror = function () {
            showToast("{{.T.Get "Network error during file upload. Please try again."}}", 'error');
                        progressBar.classList.add('is-warning');
            progressContainer.querySelector('.upload-name').innerText = `${currentFileName} upload failed`;
            cancelButton.innerHTML = '<svg class="shrink-0 size-4 is-danger" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"> <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path> </svg>';
            cancelButton.classList.remove('cancel-btn');
            done(false);
        };

        const csrf = getCsrfToken();
        if (csrf) xhr.setRequestHeader('X-CSRF-Token', csrf);

        xhr.send(formData);
    }

    window.addEventListener('beforeunload', function (e) {
        if (uploadInProgress) {
            const confirmationMessage = '{{.T.Get "An upload is in progress. Are you sure you want to leave?"}}';
            e.returnValue = confirmationMessage;
            return confirmationMessage;
        }
        if (downloadInProgress) {
            const confirmationMessage = '{{.T.Get "A download is in progress. Are you sure you want to leave?"}}';
            e.returnValue = confirmationMessage;
            return confirmationMessage;
        }
    });
});
</script>
<!-- END js code to switch upload forms and process uploads -->
