{{define "content"}}
<!-- START templates/php/ini_editor.html -->

{{if .Version}}
    <!-- Include CodeMirror -->
    <link rel="stylesheet" href="{{static "vendor/codemirror/codemirror.min.css"}}">
    <script src="{{static "vendor/codemirror/codemirror.min.js"}}"></script>
    <link rel="stylesheet" href="{{static "vendor/codemirror/theme/dracula.min.css"}}">
    <style>
        .CodeMirror {min-height: 50vh;height: auto;}
        div.CodeMirror-sizer {min-height: 500px!important;}
    </style>

<form method="post">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

<section>
    <div class="border-b flex flex-col border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-950 p-4 sm:p-6 lg:p-8 sm:flex-row sm:items-center sm:justify-between">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.Title}}</h1></div>
        <p class="text-sm text-gray-500 dark:text-gray-500">{{.FilePath}}</p>
    </div>
    <div class="mt-2 gap-2 sm:mt-0 sm:flex">
        <button id="save-changes-button" type="submit" class="relative inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-offset-2 outline-0 focus-visible:outline-2 outline-blue-500 dark:outline-blue-500 dark:border-gray-800 dark:text-gray-50 dark:bg-gray-950 dark:hover:bg-gray-900/60 disabled:text-gray-400 disabled:dark:text-gray-600 sm:w-fit mt-2 w-full gap-x-1.5 whitespace-nowrap border-black bg-black text-white hover:bg-gray-800 sm:mt-0">{{.T.Get "Save Changes"}}</button>
    </div>
</div>

    <div id="editor-container" class="overflow-auto">
        <textarea id="editor" name="editor_content" rows="40" cols="100">{{.FileContent}}</textarea>
    </div>

</section>
</form>

<script>
CodeMirror.fromTextArea(document.getElementById('editor'), {
    lineNumbers: true,
});
</script>

{{if .Issues}}
<script>
document.addEventListener('DOMContentLoaded', function () {
    if (typeof reportHealthIssues === 'function') {
        reportHealthIssues({{toJSON (printf "php-ini-editor:%s" .Version)}}, {{toJSON .Issues}}, 0);
    }
});
</script>
{{end}}

{{else}}

<!-- page header -->
<section aria-label="PHP.INI Select Header">
    <div class="border-b flex flex-col border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-950 p-4 sm:p-6 lg:p-8 sm:flex-row sm:items-center sm:justify-between">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "PHP.INI Editor"}}</h1></div>
        <p class="text-sm text-gray-500 dark:text-gray-500">{{.T.Get "Select a PHP version to edit its php.ini file directly."}}</p>
    </div>
</div>
<!-- END page header -->

<!-- form -->
<div class="sm:mx-auto sm:max-w-2xl p-6 m-6 CrawlerStatusCard" id="toAddActive">
    <form class="mt-8" method="GET" id="php_version_form">
        <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">
            <div class="col-span-full mb-5">
                <label for="php_version" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{.T.Get "Select PHP version:"}}<span class="text-red-500 dark:text-red-500">*</span></label>
                <div class="flex rounded-lg shadow-sm">
                    <select id="php_version" class="group/trigger flex w-full select-none items-center justify-between gap-2 truncate rounded border px-3 py-2 shadow-sm outline-none transition sm:text-sm border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-50 bg-white dark:bg-gray-950 mt-2" onchange="updateFormAction()" required>
                        <option value="" disabled selected>{{.T.Get "Select PHP Version"}}</option>
                        {{range .InstalledVersions}}
                        <option value="{{.}}">PHP {{.}}</option>
                        {{end}}
                    </select>
                </div>
            </div>
        </div>

        <div class="mx-auto my-6 flex w-full items-center justify-between gap-3 text-sm text-gray-500 dark:text-gray-500"><div class="h-[1px] w-full bg-gray-200 dark:bg-gray-800"></div></div>

        <div class="md:flex items-center md:justify-end md:space-x-4">
            <a href="/php/domains" class="relative inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-50 bg-white dark:bg-gray-950 hover:bg-gray-50 dark:hover:bg-gray-900/60 w-full sm:w-fit">{{.T.Get "Back to PHP versions"}}</a>
            <button class="relative hidden inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm border-black bg-black text-white hover:bg-gray-800 mt-2 w-full sm:w-auto sm:mt-0" type="submit" id="submit_version">{{.T.Get "Edit php.ini"}}</button>
        </div>
    </form>
</div>
<!-- END form -->

<script>
    function updateFormAction() {
        var version = document.getElementById('php_version').value;
        var form = document.getElementById('php_version_form');
        var submitButton = document.getElementById('submit_version');
        if (version) {
            form.action = '/php/php' + version + '.ini/editor';
            submitButton.classList.remove('hidden');
        } else {
            submitButton.classList.add('hidden');
        }
    }
</script>

</section>

{{end}}

<!-- END templates/php/ini_editor.html -->
{{end}}
