{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{.Title}}</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }

        .phpinfo {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            font-size: 22px;
            background: #6b5b95;
            color: #fff;
            padding: 10px 15px;
            margin: 0 0 10px 0;
            border-radius: 4px;
        }

        h2 {
            font-size: 16px;
            background: #8e7cc3;
            color: white;
            padding: 6px 10px;
            margin-top: 20px;
            border-radius: 3px;
        }

        .mono {
            font-family: Consolas, Menlo, Monaco, monospace;
            white-space: pre-wrap;
            font-size: 12px;
        }

        .error {
            background: #ffdddd;
            border: 1px solid #ff5c5c;
            padding: 10px;
            margin: 10px 0;
            color: #a10000;
        }

        .meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .container-box {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>
<div class="phpinfo">

    <h1>{{.Title}}</h1>

    <div class="meta">
        {{if .Service}}Service: <b>{{.Service}}</b><br>{{end}}
        {{if .Version}}Version: <b>{{.Version}}</b>{{end}}
    </div>

    {{if .FileContent}}
        <h2>PHP Configuration (php -i output)</h2>
        <div class="container-box">
            <pre class="mono">{{.FileContent}}</pre>
        </div>
    {{else}}
        <div class="error">
            No PHP information available.
        </div>
    {{end}}

</div>
</body>
</html>
{{end}}
