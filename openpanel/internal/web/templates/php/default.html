{{define "content"}}
<!-- START templates/php/default.html -->

<section aria-label="PHP Header" x-data="{ searchQuery: '' }">
    <div class="flex flex-col border-b border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-950 p-4 sm:p-6 lg:p-8 sm:flex-row sm:items-center sm:justify-between">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Default PHP version"}}</h1></div>
        <p class="text-sm text-gray-500 dark:text-gray-500">{{.T.Get "Set the default PHP version to be used for new domains."}}</p>
    </div>
    <div class="mt-2 gap-2 sm:mt-0 sm:flex">
        <p class="text-sm text-gray-500 dark:text-gray-500">{{.T.Get "Current default version:"}} <span id="current_default_version" class="font-bold">{{replace .PHPDefaultVersion "php" ""}}</span></p>
    </div>
</div>


<!-- form -->
<div class="sm:mx-auto sm:max-w-2xl p-6 m-6 CrawlerStatusCard" id="toAddActive">
    <form class="mt-8" method="POST" action="/php/default">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>
    <input type="hidden" name="previous_version" value="{{replace .PHPDefaultVersion "php" ""}}"/>
    <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">

  <div class="col-span-full mb-5">
    <label for="new_php_version" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{.T.Get "Change PHP Version:"}}<span class="text-red-500 dark:text-red-500">*</span></label>

    <div class="flex rounded-lg shadow-sm">
        <select id="new_php_version" name="new_php_version" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" required>
            <option value="" selected disabled>{{.T.Get "Select PHP Version"}}</option>
            {{range .InstalledVersions}}
            <option value="{{.}}">{{replace . "php" ""}}</option>
            {{end}}
        </select>
    </div>
  </div>
      </div>

        <div class="mx-auto my-6 flex w-full items-center justify-between gap-3 text-sm text-gray-500 dark:text-gray-500"><div class="h-[1px] w-full bg-gray-200 dark:bg-gray-800"></div></div>

<div class="md:flex items-center md:justify-end md:space-x-4">
    <a href="/php/domains" class="relative inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-offset-2 outline-0 focus-visible:outline-2 outline-blue-500 dark:outline-blue-500 border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-50 bg-white dark:bg-gray-950 hover:bg-gray-50 dark:hover:bg-gray-900/60 disabled:text-gray-400 disabled:dark:text-gray-600 w-full gap-x-0.5 whitespace-nowrap sm:w-fit">
        {{.T.Get "Back to PHP versions"}}
    </a>
    <button id="change-php-version" type="submit" class="relative inline-flex items-center justify-center rounded border px-3 py-2 text-center text-sm font-medium shadow-sm transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-offset-2 outline-0 focus-visible:outline-2 outline-blue-500 dark:outline-blue-500 dark:border-gray-800 dark:text-gray-50 dark:bg-gray-950 dark:hover:bg-gray-900/60 disabled:text-gray-400 disabled:dark:text-gray-600 mt-2 w-full sm:w-auto gap-x-1.5 whitespace-nowrap border-black bg-black text-white hover:bg-gray-800 sm:mt-0">{{.T.Get "Change"}}<svg class="w-3.5 h-3.5 ms-2 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"></path>
        </svg>
    </button>
</div>

    </form>
</div>
<!-- END form -->
</section>

<!-- END templates/php/default.html -->
{{end}}
