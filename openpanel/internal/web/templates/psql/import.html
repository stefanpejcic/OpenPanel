{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/psql/import.html -->

<header class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
    <div>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Import into database"}}</h1>
        <p class="mt-1 max-w-3xl text-sm text-gray-500">
            {{.T.Get "Select a local file to upload and import into a PostgreSQL database."}}</p>
    </div>
</header>

<!-- form -->
<div class="max-w-2xl px-4 pb-8 sm:px-6 lg:px-8">
<div id="toAddActive" class="CrawlerStatusCard rounded-md border border-gray-200 bg-white dark:border-gray-900 dark:bg-raised">
    <form method="POST" enctype="multipart/form-data" x-data="{ isInstalling: false }">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

        <div class="space-y-6 p-4 sm:p-6">
            <div>
                <label for="database_name" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "Database"}}<span class="text-red-600 dark:text-red-500">*</span></label>
                <select name="database_name" id="database_name" class="mt-2 block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500" required>
                    <option value=""></option>
                </select>
            </div>

            <div>
                <label for="file" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "SQL file"}}<span class="text-red-600 dark:text-red-500">*</span></label>
                <input type="file" name="db_file" accept=".sql" id="file" aria-describedby="file_help" class="mt-2 block w-full rounded-md border border-gray-300 bg-white text-sm text-gray-900 shadow-xs outline-hidden transition file:mr-3 file:border-0 file:border-r file:border-gray-300 file:bg-gray-50 file:px-3 file:py-2 file:text-sm file:font-medium file:text-gray-900 hover:file:bg-gray-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:file:border-gray-800 dark:file:bg-gray-900 dark:file:text-gray-50 dark:hover:file:bg-gray-800 dark:focus:border-blue-700 dark:focus:ring-blue-700/30" required>
                <p id="file_help" class="mt-2 text-xs text-gray-500">{{.T.Get "Only .sql files."}}</p>
            </div>
        </div>

        <div class="flex flex-col-reverse gap-2 border-t border-gray-200 px-4 py-4 sm:flex-row sm:justify-end sm:px-6 dark:border-gray-800">
            <button type="submit" :disabled="isInstalling" @click="isInstalling = true; $nextTick(() => $el.closest('form').submit())" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-transparent bg-blue-500 text-white hover:bg-blue-600 disabled:bg-blue-300 dark:disabled:bg-blue-800 dark:disabled:text-blue-400">
                <i x-show="isInstalling" x-cloak class="ri-loader-4-line animate-spin" aria-hidden="true"></i>
                <span x-text="isInstalling ? {{toJSON (.T.Get "Importing...")}} : {{toJSON (.T.Get "Upload & import")}}"></span>
            </button>
        </div>
    </form>
</div>
</div>
<!-- END form -->

<script>
    var selectedDbName = {{toJSON .DBName}};

    function refreshData() {
        fetch('/postgresql/info', { headers: { 'X-CSRF-TOKEN': csrf_token } })
            .then(res => res.json())
            .then(data => {
                var databaseSelect = document.querySelector("select[name='database_name']");
                databaseSelect.innerHTML = '';

                var defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.text = {{toJSON (.T.Get "Select a database")}};
                defaultOption.selected = !selectedDbName;
                databaseSelect.appendChild(defaultOption);

                data.databases.forEach(function(database) {
                    var opt = document.createElement('option');
                    opt.value = database.database;
                    opt.text = database.database;
                    if (database.database === selectedDbName) opt.selected = true;
                    databaseSelect.appendChild(opt);
                });
            })
            .catch(function (error) {
                console.error('Error fetching data:', error);
            });
    }
    refreshData();
</script>

<!-- END templates/psql/import.html -->
{{end}}
