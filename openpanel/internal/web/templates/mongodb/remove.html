{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/mongodb/remove.html -->

<div class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
    <header>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Remove user access from database"}}</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-500 max-w-2xl">{{.T.Get "Revoke a role from a MongoDB user on a database, removing their access to it."}}</p>
    </header>
</div>

<!-- form -->
<div class="max-w-2xl px-4 pb-8 sm:px-6 lg:px-8">
<div id="toAddActive" class="CrawlerStatusCard rounded-md border border-gray-200 bg-white dark:border-gray-900 dark:bg-raised">
    <form method="POST" action="/mongodb/remove_user" id="userDbForm2">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

    <div class="space-y-6 p-4 sm:p-6">
        <div>
            <label for="db_user" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "User"}}<span class="text-red-600 dark:text-red-500">*</span></label>
            <select name="db_user" id="db_user" class="block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 mt-2" required>
                <option value="" disabled>{{.T.Get "Select a username"}}</option>
            </select>
        </div>

        <div>
            <label for="database_name" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "Database"}}<span class="text-red-600 dark:text-red-500">*</span></label>
            <select name="database_name" id="database_name" class="block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 mt-2" required>
                <option value="" disabled>{{.T.Get "Select a database"}}</option>
            </select>
        </div>
        <div>
            <label for="role" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "Role"}}<span class="text-red-600 dark:text-red-500">*</span></label>
            <select name="role" id="role" class="block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 mt-2" required>
                {{range .Roles}}<option value="{{.}}"{{if eq . "readWrite"}} selected{{end}}>{{.}}</option>{{end}}
            </select>
        </div>
    </div>

    <div class="flex flex-col-reverse gap-2 border-t border-gray-200 px-4 py-4 sm:flex-row sm:justify-end sm:px-6 dark:border-gray-800">
        <a href="/mongodb" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600">{{.T.Get "Back to databases"}}</a>
        <button type="submit" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-transparent bg-red-600 text-white hover:bg-red-700 dark:bg-red-700 dark:hover:bg-red-600">{{.T.Get "Remove user from database"}}</button>
    </div>

    </form>
</div>
</div>
<!-- END form -->

<script>
function refreshData() {
    fetch('/mongodb/info', { headers: { 'X-CSRF-TOKEN': csrf_token } })
        .then(res => res.json())
        .then(data => {
            var userSelect = document.querySelector("select[name='db_user']");
            var databaseSelect = document.querySelector("select[name='database_name']");

            data.users.forEach(function(user) {
                var opt = document.createElement('option');
                opt.value = user;
                opt.text = user;
                userSelect.appendChild(opt);
            });

            data.databases.forEach(function(database) {
                var opt = document.createElement('option');
                opt.value = database.database;
                opt.text = database.database;
                databaseSelect.appendChild(opt);
            });
        })
        .catch(function (error) {
            console.error('Error fetching data:', error);
        });
}

refreshData();
</script>

<!-- END templates/mongodb/remove.html -->
{{end}}
