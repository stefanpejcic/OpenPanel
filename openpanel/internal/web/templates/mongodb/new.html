{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/mongodb/new.html -->

<div class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
    <header>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Create a database"}}</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-500">{{.T.Get "Create a new MongoDB database to store and organize collections of documents."}}</p>
    </header>
</div>

{{if .Created.Name}}
{{template "db_created" .}}
{{else}}
<!-- form -->
<div class="max-w-2xl px-4 pb-8 sm:px-6 lg:px-8">
<div id="toAddActive" class="CrawlerStatusCard rounded-md border border-gray-200 bg-white dark:border-gray-900 dark:bg-raised">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

    <div class="space-y-6 p-4 sm:p-6">
        <div x-data="{ database_name: '' }" x-init="database_name = $el.querySelector('#database_name').value">
            <label for="database_name" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "Database name"}}<span class="ml-0.5 text-red-600 dark:text-red-500">*</span></label>
            <div class="mt-2 flex">
                <input x-ref="database_name" x-model="database_name" type="text" name="database_name" id="database_name" minlength="1" maxlength="63" pattern="[a-zA-Z0-9_]+" title="{{.T.Get "Only letters, numbers, and underscores are allowed (1-63 characters)."}}" class="block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 rounded-r-none" placeholder="{{.T.Get "Database name"}}" required>
                <button type="button" @click="database_name = generateString(8); $nextTick(() => $refs.database_name.dispatchEvent(new Event('input', { bubbles: true })))" class="inline-flex shrink-0 items-center rounded-r-md border border-l-0 border-gray-300 bg-white px-3 text-gray-500 shadow-xs transition hover:bg-gray-50 hover:text-gray-900 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-400 dark:hover:bg-gray-900/60 dark:hover:text-gray-50 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2" title="{{.T.Get "Generate"}}" aria-label="{{.T.Get "Generate"}}"><i class="ri-shuffle-line text-base" aria-hidden="true"></i></button>
            </div>
        </div>
    </div>

    <div class="flex flex-col-reverse gap-2 border-t border-gray-200 px-4 py-4 sm:flex-row sm:justify-end sm:px-6 dark:border-gray-800">
        <a href="/mongodb" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600">{{.T.Get "Back to databases"}}</a>
        <button type="submit" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-transparent bg-blue-500 text-white hover:bg-blue-600 disabled:bg-blue-300 dark:disabled:bg-blue-800 dark:disabled:text-blue-400">{{.T.Get "Create database"}}</button>
    </div>

    </form>
</div>
</div>
<!-- END form -->

<script src="{{static "js/generator.js"}}"></script>

{{end}}
<!-- END templates/mongodb/new.html -->
{{end}}
