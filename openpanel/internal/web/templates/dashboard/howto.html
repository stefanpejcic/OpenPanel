{{define "howto"}}{{if .HowToGuides}}
<!-- START templates/dashboard/howto.html -->
<section id="dashboard_howto" aria-labelledby="dashboard_howto_heading" class="rounded-md border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-950 xl:col-span-1">
    <div id="dashboard_howto_title" class="border-b border-gray-200 px-4 py-3 dark:border-gray-800">
        <h2 id="dashboard_howto_heading" class="text-sm font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "General how-to"}}</h2>
    </div>
    <ul id="dashboard_howto_data" role="list" class="divide-y divide-gray-200 text-sm dark:divide-gray-800">
        {{range .HowToTopics}}
        <li>
            <a class="flex items-center justify-between gap-3 px-4 py-2.5 text-gray-900 hover:bg-gray-50 dark:text-gray-50 dark:hover:bg-gray-900/60" href="{{.Link}}" target="_blank" rel="noopener">
                <span class="min-w-0">{{$.T.Get .Title}}</span>
                <i class="ri-arrow-right-up-line shrink-0 text-gray-400 dark:text-gray-600" aria-hidden="true"></i>
            </a>
        </li>
        {{end}}
    </ul>
</section>
<!-- END templates/dashboard/howto.html -->
{{end}}{{end}}
