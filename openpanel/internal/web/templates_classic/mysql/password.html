{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/mysql/password.html -->

<header class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8 border-b border-gray-200 mb-6 dark:border-gray-800">
    <div>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "Change user password"}}</h1>
        <p class="mt-1 text-sm text-gray-500 max-w-3xl">{{.T.Get "Change password for a MySQL database user."}}</p>
    </div>
</header>

<!-- form -->
<div class="max-w-2xl px-4 pb-8 sm:px-6 lg:px-8">
<div id="toAddActive" class="CrawlerStatusCard rounded-md border border-gray-200 bg-white dark:border-gray-900 dark:bg-raised">
    <form method="POST" action="/mysql/change_user_password">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

        <div class="space-y-6 p-4 sm:p-6">
            <div>
                <label for="db_user" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "Username"}}<span class="text-red-600 dark:text-red-500">*</span></label>
                <input type="text" class="mt-2 block w-full appearance-none rounded-md border border-gray-300 bg-gray-50 px-2.5 py-2 text-sm text-gray-500 shadow-xs outline-hidden transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:focus:border-blue-700 dark:focus:ring-blue-700/30" name="db_user" id="db_user" value="{{.DBUser}}" required readonly>
            </div>

            <div
              x-data="passwordStrength({
                weak: {{toJSON (.T.Get "Weak password")}},
                medium: {{toJSON (.T.Get "Medium strength password")}},
                strong: {{toJSON (.T.Get "Strong password")}},
                tooWeak: {{toJSON (.T.Get "Password does not meet the required strength.")}}
              }, {{.PasswordStrength}})"
              x-init="checkStrength()"
            >
                <label for="new_password" class="block text-sm font-medium text-gray-900 dark:text-gray-50">{{.T.Get "Password"}}<span class="text-red-600 dark:text-red-500">*</span></label>
                <div class="mt-2 flex">
                    <input
                      type="text"
                      name="new_password"
                      id="new_password"
                      maxlength="30"
                      minlength="8"
                      title="{{.T.Get "Password must be between 8 and 30 characters."}}"
                      placeholder="{{.T.Get "New password"}}"
                      class="block w-full min-w-0 appearance-none rounded-l-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30"
                      x-model="password"
                      x-ref="input"
                      @input="checkStrength()"
                    />
                    <button type="button" id="generatePassword" aria-label="{{.T.Get "Generate password"}}" title="{{.T.Get "Generate password"}}" class="inline-flex shrink-0 items-center justify-center border border-l-0 border-gray-300 bg-white px-3 text-gray-900 shadow-xs transition hover:bg-gray-50 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60">
                        <i class="ri-shuffle-line" aria-hidden="true"></i>
                    </button>
                    <button type="button" id="togglePassword" aria-label="{{.T.Get "Show password"}}" title="{{.T.Get "Show password"}}" class="inline-flex shrink-0 items-center justify-center rounded-r-md border border-l-0 border-gray-300 bg-white px-3 text-gray-900 shadow-xs transition hover:bg-gray-50 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60">
                        <i class="ri-eye-line" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-gray-200 dark:bg-gray-800">
                    <div class="h-full rounded-full transition-all duration-300"
                      :class="{ 'bg-red-500': strength === 'Weak', 'bg-yellow-500': strength === 'Medium', 'bg-emerald-500': strength === 'Strong' }"
                      style="width: 0%"
                      :style="{ width: strength === 'Weak' ? '33%' : strength === 'Medium' ? '66%' : strength === 'Strong' ? '100%' : '0%' }"></div>
                </div>
                <p class="mt-1.5 text-xs font-medium"
                  :class="{ 'text-red-600 dark:text-red-500': strength === 'Weak', 'text-yellow-600 dark:text-yellow-500': strength === 'Medium', 'text-emerald-600 dark:text-emerald-500': strength === 'Strong' }">
                    <span x-text="strengthMessage"></span>
                </p>
            </div>
        </div>

        <input type="hidden" name="db_host" value="%">

        <div class="flex flex-col-reverse gap-2 border-t border-gray-200 px-4 py-4 sm:flex-row sm:justify-end sm:px-6 dark:border-gray-800">
            <a href="/mysql/users" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60">{{.T.Get "Back to users"}}</a>
            <button type="submit" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-black bg-black text-white hover:bg-gray-800 disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-500 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:bg-gray-900 dark:disabled:text-gray-600">{{.T.Get "Change password"}}</button>
        </div>
    </form>
</div>
</div>
<!-- END form -->

<script src="{{static "js/generator.js"}}"></script>

<script>
    document.getElementById("generatePassword").addEventListener("click", function () {
        const generatedPassword = generateString(12);
        const passwordField = document.getElementById("new_password");

        passwordField.value = generatedPassword;
        passwordField.dispatchEvent(new Event('input', { bubbles: true }));

        if (passwordField.type === "password") {
            passwordField.type = "text";
        }
    });


    document.getElementById("togglePassword").addEventListener("click", function() {
        const passwordField = document.getElementById("new_password");
        if (passwordField.type === "password") {
            passwordField.type = "text";
        } else {
            passwordField.type = "password";
        }
    });
</script>

<!-- END templates/mysql/password.html -->
{{end}}
