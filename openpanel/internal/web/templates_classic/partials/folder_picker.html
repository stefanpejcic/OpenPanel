{{define "folder_picker"}}
<!-- START templates/partials/folder_picker.html -->
<div class="col-span-full mb-5">
    <div class="flex items-center justify-between gap-2 mb-2">
        <label for="directory-select" class="block text-sm font-medium text-gray-900 dark:text-white">{{.T.Get "Choose a directory:"}}<span class="text-red-500 dark:text-red-500">*</span></label>
        <button type="button" id="folderPickerToggle" class="shrink-0 inline-flex items-center gap-1 rounded-md border border-gray-300 dark:border-gray-800 bg-white dark:bg-gray-950 px-2 py-1 text-xs font-medium text-gray-900 dark:text-gray-50 hover:bg-gray-100 dark:hover:bg-gray-900 cursor-pointer">{{.T.Get "Change path"}}</button>
    </div>

    <div id="folderPicker">
        <nav id="folderPickerCrumbs" class="flex flex-wrap items-center gap-1 text-sm min-w-0 mb-1"></nav>
        <ul id="folderPickerList" class="overflow-y-auto divide-y divide-gray-200 dark:divide-gray-800 rounded-md border border-gray-200 dark:border-gray-800 text-sm" style="height: 16rem;"></ul>
    </div>

    <div id="folderPickerManual" class="flex" style="display:none">
        <input type="text" id="directory-select" class="relative block w-full appearance-none rounded border px-2.5 py-2 outline-none transition sm:text-sm border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-50 placeholder-gray-400 dark:placeholder-gray-500 bg-white dark:bg-gray-950 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-700/30 focus:border-blue-500 dark:focus:border-blue-700 focus:z-10 disabled:opacity-50 disabled:pointer-events-none disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500" value="/var/www/html/" placeholder="/var/www/html/">
    </div>

    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">{{.T.Get "Path"}}: <span id="folderPickerSelected" class="font-mono text-gray-900 dark:text-gray-50">/var/www/html/</span></p>
</div>

<script>
// folder list from the same /json/folders endpoint the file manager's move/copy modal uses, #directory-select stays the value pages read
window.folderPicker = (function () {
    const root = '/var/www/html/';
    const text = { loading: {{toJSON (.T.Get "Loading...")}}, empty: {{toJSON (.T.Get "No subfolders")}}, folders: {{toJSON (.T.Get "Folders")}}, change: {{toJSON (.T.Get "Change path")}} };
    const $ = id => document.getElementById(id);
    const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const input = $('directory-select');
    let manual = false, locked = false, available = true;

    // folder path relative to root, null when the typed path is outside it
    function rel(full) {
        const p = (full || '').trim().replace(/\/+$/, '');
        const r = root.replace(/\/$/, '');
        if (p === r || p === '') return '';
        return p.startsWith(r + '/') ? p.slice(r.length + 1) : null;
    }

    function refresh() {
        $('folderPicker').style.display = manual || locked ? 'none' : '';
        $('folderPickerManual').style.display = manual ? '' : 'none';
        $('folderPickerToggle').style.display = locked || !available ? 'none' : '';
        $('folderPickerToggle').textContent = manual ? text.folders : text.change;
        input.readOnly = locked;
        $('folderPickerSelected').textContent = input.value;
    }

    function select(path) {
        input.value = root + (path ? path + '/' : '');
        refresh();
    }

    async function load(path) {
        const list = $('folderPickerList');
        list.innerHTML = `<li class="px-3 py-2 text-gray-500 dark:text-gray-400">${text.loading}</li>`;
        let folders;
        try {
            const res = await fetch('/json/folders/' + path.split('/').map(encodeURIComponent).join('/'));
            if (!res.ok) throw new Error(res.status);
            folders = (await res.json()).folders || [];
            if (!path) folders = folders.filter(f => f.name !== '.quarantine');
        } catch (e) {
            if (path) return load('');
            // no file manager access, the input is all there is
            available = false;
            setManual(true);
            return;
        }
        // switched to manual while this was loading, keep what's typed
        if (manual) return;
        select(path);
        const parts = path ? path.split('/') : [];
        const crumbs = [`<button type="button" data-path="" class="text-gray-700 dark:text-gray-300 hover:underline cursor-pointer"><i class="bi bi-house"></i></button>`];
        parts.forEach((part, i) => crumbs.push(`<span class="text-gray-400">/</span><button type="button" data-path="${esc(parts.slice(0, i + 1).join('/'))}" class="text-gray-700 dark:text-gray-300 hover:underline cursor-pointer truncate">${esc(part)}</button>`));
        $('folderPickerCrumbs').innerHTML = crumbs.join('');
        const rows = [];
        if (path) rows.push(`<li><button type="button" data-path="${esc(parts.slice(0, -1).join('/'))}" class="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-gray-50 dark:hover:bg-gray-900 cursor-pointer"><i class="bi bi-arrow-up"></i> ..</button></li>`);
        folders.sort((x, y) => x.name.localeCompare(y.name)).forEach(f => {
            const p = (path ? path + '/' : '') + f.name;
            rows.push(`<li><button type="button" data-path="${esc(p)}" class="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-gray-50 dark:hover:bg-gray-900 cursor-pointer"><i class="bi bi-folder-fill text-orange-500"></i><span class="truncate min-w-0">${esc(f.name)}</span>${f.has_subfolders ? '<i class="bi bi-chevron-right ml-auto text-gray-400"></i>' : ''}</button></li>`);
        });
        if (!folders.length) rows.push(`<li class="px-3 py-2 text-gray-500 dark:text-gray-400">${text.empty}</li>`);
        list.innerHTML = rows.join('');
    }

    function setManual(on) {
        manual = on;
        refresh();
        if (on) { input.focus(); return; }
        const r = rel(input.value);
        load(r === null ? '' : r);
    }

    // while a scan or fix runs only the path line and the page's own buttons stay
    function lock(on) {
        locked = on;
        refresh();
    }

    $('folderPickerList').onclick = $('folderPickerCrumbs').onclick = e => {
        const btn = e.target.closest('button[data-path]');
        if (btn && !locked) load(btn.dataset.path);
    };
    $('folderPickerToggle').onclick = () => setManual(!manual);
    input.addEventListener('input', refresh);
    load('');

    return { setManual, lock };
})();
</script>
<!-- END templates/partials/folder_picker.html -->
{{end}}
