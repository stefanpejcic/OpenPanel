{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/files/ftp_path.html -->

<!-- page header -->
<section aria-label="{{.T.Get "FTP Path Header"}}" x-data="{ searchQuery: '' }">
    <div class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8 border-b border-gray-200 mb-6 dark:border-gray-800">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "FTP path"}}</h1></div>
        <p class="mt-1 text-sm text-gray-500 max-w-3xl">{{.T.Get "Change FTP path for user"}} {{.Username}}</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
    </div>
</div>
<!-- END page header -->


<!-- form -->
<div class="mx-4 mb-8 max-w-2xl sm:mx-6 lg:mx-8 rounded-md border border-gray-200 bg-white p-4 dark:border-gray-900 dark:bg-raised CrawlerStatusCard" id="toAddActive">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

    <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">

                  <input type="hidden" id="username" name="username"  value="{{.Username}}">

            <div class="col-span-full">
              <label for="new_path" class="block text-sm font-medium text-gray-900 dark:text-gray-50 mb-2">{{.T.Get "New path"}} <span class="text-red-500 dark:text-red-500">*</span></label>
              <div
                    x-data="{
                        error: false,
                        errorMessage: '',
                        i18n: {
                            mustStartWith: '{{.T.Get "Path must start with /var/www/html/"}}',
                            noTraversal: '{{.T.Get "Path traversal (../) is not allowed"}}'
                        }
                    }">
                <input required type="text" id="new_path" :aria-invalid="error ? 'true' : 'false'" name="new_path" placeholder="/var/www/html/" title="{{.T.Get "Path must be under"}} /var/www/html/" class="block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 pe-11"
    @input="
      if (!$el.value.startsWith('/var/www/html/')) {
        error = true;
        errorMessage = i18n.mustStartWith;
      } else if ($el.value.includes('../')) {
        error = true;
        errorMessage = i18n.noTraversal;
      } else {
        error = false;
        errorMessage = '';
      }
    ">

  <template x-if="error">
        <p class="mt-2 text-xs text-red-600 dark:text-red-500" x-text="errorMessage"></p>
  </template>



              </div>
            </div>

        </div>



<div class="mt-6 flex flex-col-reverse gap-2 border-t border-gray-200 pt-4 sm:flex-row sm:justify-end dark:border-gray-800">
    <a href="/ftp" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600">
        {{.T.Get "Back to FTP accounts"}}
    </a>
    <button type="submit" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-black bg-black text-white hover:bg-gray-800 disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-500 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:bg-gray-900 dark:disabled:text-gray-600">{{.T.Get "Update"}}</button>
</div>

    </form>
</div>
<!-- END form -->

<!-- END templates/files/ftp_path.html -->
{{end}}
