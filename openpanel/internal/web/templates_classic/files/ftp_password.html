{{define "alpine_plugins"}}{{end}}

{{define "content"}}
<!-- START templates/files/ftp_password.html -->

<!-- page header -->
<section aria-label="{{.T.Get "FTP Password Header"}}" x-data="{ searchQuery: '' }">
    <div class="flex flex-col gap-4 px-4 pt-6 pb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8 border-b border-gray-200 mb-6 dark:border-gray-800">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">{{.T.Get "FTP password"}}</h1></div>
        <p class="mt-1 text-sm text-gray-500 max-w-3xl">{{.T.Get "Change FTP password for user"}} {{.Username}}</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
    </div>
</div>
<!-- END page header -->


<!-- form -->
<div class="mx-4 mb-8 max-w-2xl sm:mx-6 lg:mx-8 rounded-md border border-gray-200 bg-white p-4 dark:border-gray-900 dark:bg-raised CrawlerStatusCard" id="toAddActive">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>

    <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">

                  <input type="hidden" id="username" name="username"  value="{{.Username}}">



<div
  class="col-span-full"
  x-data="passwordStrength({
    weak: '{{.T.Get "Weak password"}}',
    medium: '{{.T.Get "Medium strength password"}}',
    strong: '{{.T.Get "Strong password"}}',
    tooWeak: '{{.T.Get "Password does not meet the required strength."}}'
  }, {{.PasswordStrength}})"
  x-init="checkStrength()"
>
  <label
    for="new_password"
    class="block text-sm font-medium text-gray-900 dark:text-gray-50 mb-2"
  >
    {{.T.Get "New password"}} <span class="text-red-500 dark:text-red-500">*</span>
  </label>
  <div class="flex">
    <input
      type="text"
      name="new_password"
      id="new_password"
      maxlength="30"
      minlength="8"
      pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9]).{8,}"
      title="{{.T.Get "Password must be 8-30 characters and include a lowercase letter, an uppercase letter, a number, and a special character."}}"
      placeholder="{{.T.Get "New password"}}"
      class="block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 rounded-r-none"
      x-model="password"
      x-ref="input"
      @input="checkStrength()"
    />

    <div class="input-group-append flex">
      <button
        class="-ml-px inline-flex items-center border border-gray-300 bg-white px-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 focus:z-10 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-400 dark:hover:bg-gray-900/60 dark:hover:text-gray-50"
        type="button"
        id="generate_password" aria-label="{{.T.Get "Generate password"}}" title="{{.T.Get "Generate password"}}">
        <i class="ri-shuffle-line"></i>
      </button>
    </div>
    <div class="input-group-append flex">
      <button class="-ml-px inline-flex items-center border border-gray-300 bg-white px-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 focus:z-10 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-400 dark:hover:bg-gray-900/60 dark:hover:text-gray-50" type="button" id="toggle_password" aria-label="{{.T.Get "Show password"}}" title="{{.T.Get "Show password"}}">
        <i class="ri-eye-line"></i>
      </button>
    </div>

    <div class="input-group-append flex">
        <span class="flex d-none" id="copy-password-link">

        <button type="button" id="copy-password" aria-label="{{.T.Get "Copy"}}" title="{{.T.Get "Copy"}}" class="-ml-px inline-flex items-center border border-gray-300 bg-white px-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 focus:z-10 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-400 dark:hover:bg-gray-900/60 dark:hover:text-gray-50 h-full rounded-r-md">
            <i class="ri-clipboard-line"></i>
        </button>

        </span>
    </div>
  </div>

  <!-- new_password strength indicator -->
  <div class="mt-2 h-1.5 rounded-full bg-gray-200 dark:bg-gray-800 overflow-hidden">
    <div
      class="h-full rounded-full transition-all duration-300"
      :class="{
        'bg-red-500': strength === 'Weak',
        'bg-yellow-500': strength === 'Medium',
        'bg-emerald-500': strength === 'Strong',
        'w-1/3': strength === 'Weak',
        'w-2/3': strength === 'Medium',
        'w-full': strength === 'Strong'
      }"
      style="width: 0%"
      :style="{
        width:
          strength === 'Weak'
            ? '33%'
            : strength === 'Medium'
            ? '66%'
            : strength === 'Strong'
            ? '100%'
            : '0%'
      }"
    ></div>
  </div>
  <p
    class="mt-1 text-sm font-semibold"
    :class="{
      'text-red-600 dark:text-red-500': strength === 'Weak',
      'text-yellow-600 dark:text-yellow-500': strength === 'Medium',
      'text-emerald-600 dark:text-emerald-500': strength === 'Strong'
    }"
  >
    <span x-text="strengthMessage" class="text-xs"></span>
  </p>
</div>


            <div class="col-span-full">
              <label for="confirm_password" class="block text-sm font-medium text-gray-900 dark:text-gray-50 mb-2">{{.T.Get "Confirm password"}} <span class="text-red-500 dark:text-red-500">*</span></label>
              <div class="flex">
                <input required type="password" id="confirm_password" name="confirm_password" placeholder="{{.T.Get "Confirm new password"}}" maxlength="30" class="block w-full appearance-none rounded-md border border-gray-300 bg-white px-2.5 py-2 text-sm text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 pe-11">



              </div>
              <div id="passwordError" class="mt-2 text-xs text-red-600 dark:text-red-500" style="display:none;">
                {{.T.Get "Passwords do not match."}}
              </div>
            </div>

        </div>



<div class="mt-6 flex flex-col-reverse gap-2 border-t border-gray-200 pt-4 sm:flex-row sm:justify-end dark:border-gray-800">
    <a href="/ftp" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-gray-300 bg-white text-gray-900 hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600">
        {{.T.Get "Back to FTP accounts"}}
    </a>
    <button type="submit" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 border-black bg-black text-white hover:bg-gray-800 disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-500 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:bg-gray-900 dark:disabled:text-gray-600">{{.T.Get "Update"}}</button>
</div>

    </form>
</div>
<!-- END form -->


    <script>
// Sve za pass generate, copy to clipboard i hide/show
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("new_password");
            const confirmPasswordInput = document.getElementById("confirm_password");
            const showHideButton = document.getElementById("toggle_password");
            const eyeIcon = showHideButton.querySelector("i");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                confirmPasswordInput.type = "text";
                eyeIcon.classList.remove("ri-eye-line");
                eyeIcon.classList.add("ri-eye-off-line");
            } else {
                passwordInput.type = "password";
                confirmPasswordInput.type = "password";
                eyeIcon.classList.remove("ri-eye-off-line");
                eyeIcon.classList.add("ri-eye-line");
            }
        }

        document.getElementById("toggle_password").addEventListener("click", togglePasswordVisibility);

        function generateRandomPassword() {
            const lowercase = "abcdefghijklmnopqrstuvwxyz";
            const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const digits = "0123456789";
            const special = "!@#$%^&*+=?";
            const allChars = lowercase + uppercase + digits + special;

            let password = "";

            password += lowercase[Math.floor(Math.random() * lowercase.length)];
            password += uppercase[Math.floor(Math.random() * uppercase.length)];
            password += digits[Math.floor(Math.random() * digits.length)];
            password += special[Math.floor(Math.random() * special.length)];

            for (let i = 4; i < 12; i++) {
                password += allChars[Math.floor(Math.random() * allChars.length)];
            }

            const arr = password.split("");
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }

            return arr.join("");
        }

        function copyPasswordToClipboard() {
            const passwordInput = document.createElement("input");
            passwordInput.type = "text";
            passwordInput.value = document.getElementById("new_password").value;
            document.body.appendChild(passwordInput);
            passwordInput.select();
            document.execCommand("copy");
            document.body.removeChild(passwordInput);

            const copyLink = document.getElementById("copy-password");
            copyLink.innerHTML = '<i class="ri-check-line"></i>';

            setTimeout(() => {
                copyLink.innerHTML = '<i class="ri-clipboard-line"></i>';
            }, 3000);
        }

        function generatePasswordAndFill() {
            const newPassword = generateRandomPassword();
            const showHideButton = document.getElementById("toggle_password");
            const eyeIcon = showHideButton.querySelector("i");

            document.getElementById("new_password").type = "text";
            document.getElementById("confirm_password").type = "text";
            document.getElementById("new_password").value = newPassword;
            document.getElementById("confirm_password").value = newPassword;
            const passwordField = document.getElementById("new_password");
            passwordField.dispatchEvent(new Event('input', { bubbles: true }));
            eyeIcon.classList.remove("ri-eye-line");
            eyeIcon.classList.add("ri-eye-off-line");
            document.getElementById("copy-password-link").classList.remove("d-none");
        }

        document.getElementById("generate_password").addEventListener("click", function() {
            generatePasswordAndFill();
        });

        document.getElementById("copy-password").addEventListener("click", copyPasswordToClipboard);

        // When the page loads, populate random values for the inputs
        document.addEventListener("DOMContentLoaded", function () {
            generatePasswordAndFill();
        });

        document.querySelector("#toAddActive form").addEventListener("submit", function(e) {
            const password = document.getElementById("new_password").value;
            const confirmPassword = document.getElementById("confirm_password").value;
            const errorDiv = document.getElementById("passwordError");

            if (password !== confirmPassword) {
                e.preventDefault();
                errorDiv.style.display = "block";
            } else {
                errorDiv.style.display = "none";
            }
        });
    </script>

<!-- END templates/files/ftp_password.html -->
{{end}}
